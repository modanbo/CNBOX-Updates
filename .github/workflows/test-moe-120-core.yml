name: Test MoE 1.2.0 pure core

on:
  push:
    branches:
      - work/moe-component-1.2.0-full-rebuild
    paths:
      - 'moe/rebuild/1.2.0/source/**'
      - 'moe/rebuild/1.2.0/tests/**'
      - '.github/workflows/test-moe-120-core.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/moe-component-1.2.0-full-rebuild
      - name: Python 3 pure-core tests
        run: python3 moe/rebuild/1.2.0/tests/test_core.py
      - name: Python 2 syntax compatibility guard
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import ast, glob, re
          forbidden = [
              re.compile(r'(^|[^A-Za-z0-9_])f[\"\\\']'),
              re.compile(r'\\basync\\s+def\\b'),
              re.compile(r'\\bawait\\s+'),
              re.compile(r'\\byield\\s+from\\b'),
              re.compile(r'\\bnonlocal\\b'),
              re.compile(r'\\btyping\\.'),
          ]
          for p in glob.glob('moe/rebuild/1.2.0/source/*.py'):
              src=open(p,encoding='utf-8').read()
              ast.parse(src,filename=p)
              for pat in forbidden:
                  assert not pat.search(src), (p, pat.pattern)
              print('PARSE_PY2_SAFE',p)
          PY
