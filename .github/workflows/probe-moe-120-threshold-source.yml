name: Probe MoE 1.2.0 threshold build source

on:
  push:
    branches:
      - work/moe-component-1.2.0-full-rebuild
    paths:
      - '.github/workflows/probe-moe-120-threshold-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/moe-component-1.2.0-full-rebuild
          fetch-depth: 0

      - name: Inspect Tomato NA MoE page structure
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/tomato"
          curl -fL --retry 3 --connect-timeout 20 -A 'Mozilla/5.0' 'https://tomato.gg/moe/NA' -o "$RUNNER_TEMP/tomato/page.html"
          python3 - "$RUNNER_TEMP/tomato/page.html" "$GITHUB_WORKSPACE/moe/rebuild/1.2.0/THRESHOLD_SOURCE_PROBE.txt" <<'PY'
          import re,sys,json,html
          src=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          out=[]
          out.append('bytes=%d'%len(src))
          for token in ['__NEXT_DATA__','M47 Chevalier','Obj. 279','Last Update','100%','page=2','moe/NA']:
              out.append('%s=%s'%(token, token in src))
          out.append('')
          out.append('links containing moe/page/tank:')
          for m in re.findall(r'href=["\']([^"\']+)["\']',src):
              if 'moe' in m.lower() or '/tanks/' in m.lower() or 'page' in m.lower():
                  out.append(m)
          out.append('')
          out.append('script src:')
          for m in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',src):
              out.append(m)
          out.append('')
          out.append('snippets:')
          for needle in ['M47 Chevalier','Obj. 279','Last Update']:
              i=src.find(needle)
              if i>=0: out.append(html.unescape(src[max(0,i-500):i+1500]))
          open(sys.argv[2],'w',encoding='utf-8').write('\n'.join(out))
          PY

      - name: Commit probe result
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add moe/rebuild/1.2.0/THRESHOLD_SOURCE_PROBE.txt
          git commit -m 'Probe MoE 1.2.0 threshold build source'
          git push origin HEAD:work/moe-component-1.2.0-full-rebuild
