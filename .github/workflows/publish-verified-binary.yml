name: Publish verified NAJXBox binary

on:
  push:
    branches: [main]
    paths:
      - ".publisher/request.json"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate and publish
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $req = Get-Content ".publisher/request.json" -Raw | ConvertFrom-Json

          if ($req.schemaVersion -ne 1) { throw "Unsupported request schema" }
          if ($req.PSObject.Properties.Name -contains "active" -and $req.active -eq $false) {
            Write-Host "Publisher request is inactive; nothing to do."
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($req.sourceUrl)) { throw "Missing sourceUrl" }
          if ([string]::IsNullOrWhiteSpace($req.destination)) { throw "Missing destination" }

          $uri = [Uri]$req.sourceUrl
          if ($uri.Scheme -ne "https") { throw "Only HTTPS sources are allowed" }
          if (-not $uri.Host.EndsWith(".oaiusercontent.com", [StringComparison]::OrdinalIgnoreCase)) {
            throw "Source host is not allow-listed"
          }

          $dest = ([string]$req.destination).Replace("\","/")
          if ($dest.StartsWith("/") -or $dest.Contains("..") -or
              $dest -notmatch "^(manager|payloads|manifests|profiles|language)/[A-Za-z0-9._/-]+$") {
            throw "Unsafe destination: $dest"
          }

          $tmp = Join-Path $env:RUNNER_TEMP "najxbox-source.bin"
          Invoke-WebRequest -Uri $req.sourceUrl -OutFile $tmp -UseBasicParsing

          $sourceHash = (Get-FileHash $tmp -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not [string]::IsNullOrWhiteSpace($req.sourceSha256) -and
              $sourceHash -ne ([string]$req.sourceSha256).ToLowerInvariant()) {
            throw "Source SHA256 mismatch"
          }

          $output = $tmp
          $expanded = $null
          if (([string]$req.archive).ToLowerInvariant() -eq "zip") {
            if ([string]::IsNullOrWhiteSpace($req.extract)) { throw "Missing extract member" }
            $extractName = ([string]$req.extract).Replace("\","/")
            if ($extractName.StartsWith("/") -or $extractName.Contains("..")) { throw "Unsafe extract member" }

            $expanded = Join-Path $env:RUNNER_TEMP "expanded"
            Expand-Archive -Path $tmp -DestinationPath $expanded -Force
            $candidate = Join-Path $expanded $extractName
            if (!(Test-Path -LiteralPath $candidate -PathType Leaf)) { throw "Extract member not found: $extractName" }
            $output = $candidate
          }

          $outputHash = (Get-FileHash $output -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not [string]::IsNullOrWhiteSpace($req.outputSha256) -and
              $outputHash -ne ([string]$req.outputSha256).ToLowerInvariant()) {
            throw "Output SHA256 mismatch"
          }

          # Free security gate for Public Manager EXEs.
          # Creator remains an engineering flavor and is intentionally excluded.
          $isPublicManager =
            $dest -match '^manager/(?:CNBOX_Manager|NAJXBox_Manager(?:_v[0-9]+\.[0-9]+\.[0-9]+)?)\.exe$'

          if ($isPublicManager) {
            if ($null -eq $expanded) {
              throw "Public Manager publication requires a security-gated ZIP source."
            }
            if ([string]::IsNullOrWhiteSpace($req.securityExtract)) {
              throw "Public Manager publication requires securityExtract."
            }

            $securityName = ([string]$req.securityExtract).Replace("\","/")
            if ($securityName.StartsWith("/") -or $securityName.Contains("..")) {
              throw "Unsafe securityExtract member"
            }
            $securityPath = Join-Path $expanded $securityName
            if (!(Test-Path -LiteralPath $securityPath -PathType Leaf)) {
              throw "Security gate manifest not found: $securityName"
            }

            $security = Get-Content -LiteralPath $securityPath -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($security.schemaVersion -ne 1) { throw "Unsupported Public security manifest schema" }
            if ($security.product -ne "NAJXBox Manager") { throw "Security manifest product mismatch" }
            if ($security.finalSha256.ToLowerInvariant() -ne $outputHash) {
              throw "Security manifest SHA256 does not match Public EXE"
            }
            if ($security.defender.status -ne "PASS") { throw "Microsoft Defender security gate is not PASS" }
            if ($security.virustotal.status -ne "PASS") { throw "VirusTotal security gate is not PASS" }
            if ([int]$security.virustotal.malicious -ne 0) { throw "VirusTotal malicious detections are non-zero" }
            if ([int]$security.virustotal.suspicious -ne 0) { throw "VirusTotal suspicious detections are non-zero" }

            Write-Host "PUBLIC FREE SECURITY GATE PASS"
            Write-Host "  SHA256: $outputHash"
            Write-Host "  Authenticode: optional / may be NotSigned"
            Write-Host "  Defender: PASS"
            Write-Host "  VirusTotal malicious=0 suspicious=0"
          }

          $destPath = Join-Path $env:GITHUB_WORKSPACE $dest
          New-Item -ItemType Directory -Force -Path (Split-Path $destPath -Parent) | Out-Null
          Copy-Item -LiteralPath $output -Destination $destPath -Force

          git config user.name "najxbox-release-bot"
          git config user.email "najxbox-release-bot@users.noreply.github.com"
          git add -- "$dest"
          if (git diff --cached --quiet) {
            Write-Host "No binary change to publish."
          } else {
            git commit -m "Publish $dest"
            git push
          }
