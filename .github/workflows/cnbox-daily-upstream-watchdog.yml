name: CNBOX daily upstream execution watchdog
on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cnbox-daily-upstream-watchdog.yml'
permissions:
  contents: read
jobs:
  daily-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Enforce New York 05:00 (both DST and standard time)
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ] || [ "$(TZ=America/New_York date +%H)" = "05" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - name: Independent native upstream and official-site checks
        if: steps.gate.outputs.run == 'true'
        env:
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib,re,json,datetime,pathlib
          now=datetime.datetime.now(datetime.timezone.utc)
          index=json.loads(pathlib.Path("aslain_catalogs/index.json").read_text())
          cat=index["catalogs"][0]
          version=cat["wotVersion"]
          sources=[
            ("native",f"https://repo.aslain.com/wot_modmanager/{version}/Configuration"),
            ("official_page","https://aslain.com/index.php?/topic/13-aslains-wot-modpack/")
          ]
          result={"checkedAtUTC":now.isoformat(),"dateNewYork":datetime.datetime.now(datetime.timezone(datetime.timedelta(0))).isoformat(),"catalogReference":cat["aslainVersion"],"sources":[],"status":"UNKNOWN","note":"Independent upstream watchdog only; NOT runtime verification or full migration."}
          for label,url in sources:
            record={"name":label,"url":url}
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 CNBOX-Upstream-Watchdog/1.0","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=55) as response:
                data=response.read(6000000)
                record["httpStatus"]=response.status
                record["bytesRead"]=len(data)
                record["sha256OfReadBytes"]=hashlib.sha256(data).hexdigest()
                text=data.decode("utf-8","replace")
                matches=re.findall(r"(?:ContentVersion|v2\.4\.\d+\.\d+\s*#\s*\d+|2\.4\.\d+\.\d+\s*#\s*\d+)",text,re.I)
                record["versionHints"]=matches[:12]
                if label=="native":
                  record["versionPatternMatches"]=re.findall(r"v?"+re.escape(version)+r"\s*#\s*(\d+)",text,re.I)[:20]
            except Exception as e:
              record["error"]=str(e)
            result["sources"].append(record)
          native=result["sources"][0]
          builds=[int(v) for v in native.get("versionPatternMatches",[]) if v.isdigit()]
          detected=max(builds) if builds else None
          catalog_build=int(re.search(r"#\s*(\d+)",cat["aslainVersion"]).group(1))
          result["nativeDetectedBuild"]=detected
          result["catalogBuild"]=catalog_build
          result["migrationRequired"]=bool(detected is not None and detected>catalog_build)
          result["status"]="NEW_VERSION_DETECTED" if result["migrationRequired"] else ("CHECKED" if all("httpStatus" in x for x in result["sources"]) else "PARTIAL_SOURCE_FAILURE")
          pathlib.Path("cnbox_daily_receipt.json").write_text(json.dumps(result,indent=2,ensure_ascii=False)+"\n")
          print(json.dumps(result,indent=2,ensure_ascii=False))
          if not any("httpStatus" in x for x in result["sources"]): raise SystemExit("Both independent upstream sources unavailable")
          PY
      - name: Dynamically resolve all future releases and stage source evidence
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 - <<'PY'
          import json,pathlib,re,urllib.request,hashlib,xml.etree.ElementTree as ET
          p=pathlib.Path("cnbox_daily_receipt.json")
          d=json.loads(p.read_text())
          native=d["sources"][0]
          page=d["sources"][1]
          versions=re.findall(r'2\.4\.\d+\.\d+\s*#\s*\d+',str(page.get("versionHints",[])))
          native_version=(native.get("versionHints") or [None,None])[-1]
          d["upstreamFullVersion"]=native_version
          d["officialVersionHints"]=versions
          if not native.get("httpStatus") or not page.get("httpStatus"):
              d["handoff"]={"status":"TRANSIENT_RETRY","reason":"Both authoritative sources required before selecting upstream"}
              p.write_text(json.dumps(d,indent=2)+"\n")
              raise SystemExit("Both official sources must be available")
          catalog=d["catalogReference"]
          if not native_version or not re.fullmatch(r'v?\d+\.\d+\.\d+\.\d+\s*#\s*\d+',native_version):
              d["handoff"]={"status":"TRANSIENT_RETRY","reason":"Cannot confirm native version"}
              p.write_text(json.dumps(d,indent=2)+"\n")
              raise SystemExit("Unknown native version")
          def key(s):
              a,b=re.search(r'(\d+\.\d+\.\d+\.\d+)\s*#\s*(\d+)',s).groups()
              return tuple(map(int,a.split(".")))+(int(b),)
          new=key(native_version)>key(catalog)
          d["migrationRequired"]=new
          d["handoff"]={"status":"NEW_VERSION_INTAKE_REQUIRED" if new else "UP_TO_DATE",
                        "target":native_version,
                        "nextAction":"Acquire official SHA-verified native installer; current-Choice owner audit; Drive archival; two reviews; real Runtime remains NOT_TESTED" if new else "Routine next daily check",
                        "note":"For ANY future build; no fixed #08 workflows dispatched. Detection alone is not migrated/archived."}
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+"\n")
          print(json.dumps(d["handoff"],ensure_ascii=False))
          if new:
              raise SystemExit("NEW_VERSION_INTAKE_REQUIRED: cannot report green until generic engineering/Drive work is completed")
          PY
      - name: Upload daily execution receipt
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: cnbox-daily-upstream-receipt
          path: cnbox_daily_receipt.json
          retention-days: 7
          if-no-files-found: warn
