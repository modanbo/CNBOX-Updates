name: Prepare Python27 decompiler bridge tool

on:
  workflow_dispatch:
  push:
    branches:
      - work/moe-component-1.1.3-cn-host-na-data-bridge
    paths:
      - '.github/workflows/prepare-py27-decompiler-tool.yml'

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Build portable Python package bundle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p bundle
          python3 -m pip install --disable-pip-version-check --no-cache-dir -t bundle uncompyle6
          python3 - <<'PY'
          import os,sys
          sys.path.insert(0,'bundle')
          import uncompyle6,xdis
          print('uncompyle6',uncompyle6.__version__)
          print('xdis',xdis.__version__)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PY27_DECOMPILER_BRIDGE_TOOL
          path: bundle
          if-no-files-found: error
