name: Build CNBOX standalone MoE component

on:
  push:
    branches:
      - work/moe-component-1.0.1
    paths:
      - 'moe/source/**'
      - '.github/workflows/build-cnbox-moe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/moe-component-1.0.1
          fetch-depth: 0

      - name: Fetch pinned ProTanki upstream and FFDec
        shell: bash
        run: |
          set -euxo pipefail
          root="$RUNNER_TEMP/cnbox-moe"
          mkdir -p "$root"

          curl -fL --retry 3 --connect-timeout 20 \
            'https://repo.aslain.com/wot_modmanager/Files/MarksOnGun/MarksOnGun_Gun_Marks_Calculator_a834e732.zip' \
            -o "$root/protanki.zip"
          echo '3df826d272877fca504b48d968b68e4e82e7118ba7da17c27ae61c5fc24201ee  '"$root"'/protanki.zip' | sha256sum -c -

          curl -fL --retry 3 --connect-timeout 20 \
            'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.3.0/ffdec_26.3.0.zip' \
            -o "$root/ffdec.zip"
          echo '35f4930eb7c380afe66f2117f90b006deac0631473ad7500bb39c78f68645ecd  '"$root"'/ffdec.zip' | sha256sum -c -

          mkdir -p "$root/upstream" "$root/ffdec"
          unzip -q "$root/protanki.zip" -d "$root/upstream"
          unzip -q "$root/ffdec.zip" -d "$root/ffdec"
          chmod +x "$root/ffdec/ffdec.sh"

          mkdir -p "$root/core"
          unzip -q "$root/upstream/mods/2.4.0.1/tv.protanki.gunmarkscalc_8.1.01.wotmod" -d "$root/core"

      - name: Import CNBOX compact UI without touching calculation backend
        shell: bash
        run: |
          set -euxo pipefail
          root="$RUNNER_TEMP/cnbox-moe"

          "$root/ffdec/ffdec.sh" -onerror abort -importScript \
            "$root/core/res/gui/flash/protanki_gunmarks_battle.swf" \
            "$root/protanki_gunmarks_battle_cnbox.swf" \
            "$GITHUB_WORKSPACE/moe/source"

          cp "$root/protanki_gunmarks_battle_cnbox.swf" \
             "$root/core/res/gui/flash/protanki_gunmarks_battle.swf"

          mkdir -p "$root/core/res/mods/cnbox.moe"
          cat > "$root/core/res/mods/cnbox.moe/NOTICE.txt" <<'EOF'
          CNBOX MoE UI variant

          Calculation/backend: ProTanki Gun Marks Calculator (tv.protanki.gunmarkscalc 8.1.01)
          Original package source: https://protanki.tv/ and Aslain's WoT Modpack repository.
          CNBOX changes: battle presentation only. Calculation/data flow and persisted offset
          handling remain in the original ProTanki backend.

          Field mapping used by the compact UI:
          - predictedRating + deltaRating -> projected MoE percentage and change
          - currentMovingDamage -> current battle MoE-effective combined damage
          - battleMovingDamage + deltaDamage -> projected moving average damage and change

          Drag persistence remains original: ProGunMarks sends updatePosition(offsetBattle) on
          mouse-up and the backend restores offsetBattle in the next battle/client session.
          EOF
          sed -i 's/^          //' "$root/core/res/mods/cnbox.moe/NOTICE.txt"

          rm -rf "$root/verify"
          mkdir "$root/verify"
          "$root/ffdec/ffdec.sh" -export script "$root/verify" \
            "$root/core/res/gui/flash/protanki_gunmarks_battle.swf"

          # UI wire contract: these are existing ProTanki battle payload fields.
          # Lock all five CN-panel values plus the original position hand-off.
          grep -Rqs '本场标伤' "$root/verify"
          grep -Rqs '平均标伤' "$root/verify"
          grep -Rqs 'predictedRating' "$root/verify"
          grep -Rqs 'deltaRating' "$root/verify"
          grep -Rqs 'currentMovingDamage' "$root/verify"
          grep -Rqs 'battleMovingDamage' "$root/verify"
          grep -Rqs 'deltaDamage' "$root/verify"
          grep -Rqs 'offsetBattle' "$root/verify"
          grep -Rqs 'anchorPoint' "$root/verify"
          grep -Rqs 'updatePosition(this._offset)' "$root/verify"
          echo '=== STATIC_MOE_FLASH_BRIDGE_REFERENCES ==='
          grep -RniE 'updatePosition|offsetBattle|as_setSettings' "$root/verify" | head -n 200

      - name: Build deterministic WOTMOD and Manager payload
        shell: bash
        run: |
          set -euxo pipefail
          root="$RUNNER_TEMP/cnbox-moe"
          out="$GITHUB_WORKSPACE/moe/1.0.1"
          rm -rf "$out" "$root/payload"
          mkdir -p "$out" "$root/payload/mods/2.4.0.1/net.openwg"

          python3 - <<'PY'
          import os, zipfile
          src=os.environ['RUNNER_TEMP']+'/cnbox-moe/core'
          out=os.environ['RUNNER_TEMP']+'/cnbox-moe/payload/mods/2.4.0.1/tv.protanki.gunmarkscalc_8.1.01.wotmod'
          rows=[]
          for dp, _, files in os.walk(src):
              for name in files:
                  p=os.path.join(dp,name)
                  rows.append((os.path.relpath(p,src).replace(os.sep,'/'),p))
          rows.sort()
          with zipfile.ZipFile(out,'w',zipfile.ZIP_STORED) as z:
              for arc,p in rows:
                  zi=zipfile.ZipInfo(arc,(1980,1,1,0,0,0))
                  zi.compress_type=zipfile.ZIP_STORED
                  zi.external_attr=0o644<<16
                  with open(p,'rb') as fh:
                      z.writestr(zi,fh.read())
          PY

          cp "$root/upstream/mods/2.4.0.1/izeberg.modssettingsapi_1.7.0.wotmod" \
             "$root/payload/mods/2.4.0.1/"
          cp "$root/upstream/mods/2.4.0.1/me.poliroid.modslistapi_1.7.9.wotmod" \
             "$root/payload/mods/2.4.0.1/"
          cp "$root/upstream/mods/2.4.0.1/net.openwg/net.openwg.gameface_1.1.6.wotmod" \
             "$root/payload/mods/2.4.0.1/net.openwg/"

          # The Aslain single-mod archive does not carry ProTanki's external JSON;
          # Aslain's installer normally lays it down separately. Build the known upstream
          # default deterministically for FIRST install. Manager v1.2.10 treats this file as
          # user-owned: an existing copy is never overwritten and uninstall never removes it,
          # so offset/anchor survive battles, client restarts and reinstall.
          mkdir -p "$root/payload/mods/configs/protanki"
          cat > "$root/payload/mods/configs/protanki/gunMarksCalculator.json" <<'EOF'
          {
            "enable": true,
            "enabled": true,
            "offset": [107, 342],
            "minimized": false,
            "skinVariant": "new",
            "anchorPoint": "top-right",
            "progressLogic": "damage",
            "accountMark": true
          }
          EOF
          sed -i 's/^          //' "$root/payload/mods/configs/protanki/gunMarksCalculator.json"

          python3 - <<'PY'
          import os, zipfile, hashlib, json
          root=os.environ['RUNNER_TEMP']+'/cnbox-moe'
          src=root+'/payload'
          out=os.environ['GITHUB_WORKSPACE']+'/moe/1.0.1/CNBOX_MoE_1.0.1_WOT_2.4.0.1.zip'
          rows=[]
          for dp, _, files in os.walk(src):
              for name in files:
                  p=os.path.join(dp,name)
                  rows.append((os.path.relpath(p,src).replace(os.sep,'/'),p))
          rows.sort()
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for arc,p in rows:
                  zi=zipfile.ZipInfo(arc,(1980,1,1,0,0,0))
                  zi.compress_type=zipfile.ZIP_DEFLATED
                  zi.external_attr=0o644<<16
                  with open(p,'rb') as fh:
                      z.writestr(zi,fh.read())

          def sha(p):
              h=hashlib.sha256()
              with open(p,'rb') as fh:
                  for b in iter(lambda:fh.read(1024*1024),b''):
                      h.update(b)
              return h.hexdigest()

          specs=[
              ('mods/{WOT_VERSION}/izeberg.modssettingsapi_1.7.0.wotmod',
               src+'/mods/2.4.0.1/izeberg.modssettingsapi_1.7.0.wotmod', True),
              ('mods/{WOT_VERSION}/me.poliroid.modslistapi_1.7.9.wotmod',
               src+'/mods/2.4.0.1/me.poliroid.modslistapi_1.7.9.wotmod', True),
              ('mods/{WOT_VERSION}/net.openwg/net.openwg.gameface_1.1.6.wotmod',
               src+'/mods/2.4.0.1/net.openwg/net.openwg.gameface_1.1.6.wotmod', True),
              ('mods/{WOT_VERSION}/tv.protanki.gunmarkscalc_8.1.01.wotmod',
               src+'/mods/2.4.0.1/tv.protanki.gunmarkscalc_8.1.01.wotmod', False),
          ]
          manifest={
              'id':'CNBOX_MOE',
              'version':'1.0.1',
              'status':'candidate',
              'wotVersion':'2.4.0.1',
              'sourceCore':'ProTanki Gun Marks Calculator 8.1.01',
              'sourceUrl':'https://protanki.tv/',
              'payloadUrl':'https://raw.githubusercontent.com/modanbo/CNBOX-Updates/main/moe/1.0.1/CNBOX_MoE_1.0.1_WOT_2.4.0.1.zip',
              'payloadSha256':sha(out),
              'notes':'Standalone Manager component. CNBOX changes battle UI only. ProTanki calculation/data flow stays original; mods/configs/protanki/gunMarksCalculator.json is installed only when missing and is preserved on update/uninstall so the drag offset survives battles and restarts.',
              'installedFiles':[
                  {'path':rel,'sha256':sha(p),'required':True,'shared':shared}
                  for rel,p,shared in specs
              ]
          }
          with open(os.environ['GITHUB_WORKSPACE']+'/moe/1.0.1/manifest.json','w',encoding='utf-8') as fh:
              json.dump(manifest,fh,ensure_ascii=False,indent=2)
              fh.write('\n')
          with open(os.environ['GITHUB_WORKSPACE']+'/moe/1.0.1/SHA256SUMS.txt','w') as fh:
              fh.write(manifest['payloadSha256']+'  CNBOX_MoE_1.0.1_WOT_2.4.0.1.zip\n')
              for spec,(_,p,_) in zip(manifest['installedFiles'],specs):
                  fh.write(spec['sha256']+'  '+spec['path']+'\n')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Static integrity checks
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json,zipfile,hashlib,os
          root='moe/1.0.1'
          m=json.load(open(root+'/manifest.json',encoding='utf-8'))
          payload=root+'/CNBOX_MoE_1.0.1_WOT_2.4.0.1.zip'
          assert hashlib.sha256(open(payload,'rb').read()).hexdigest()==m['payloadSha256']
          with zipfile.ZipFile(payload) as z:
              names=set(z.namelist())
              for spec in m['installedFiles']:
                  rel=spec['path'].replace('{WOT_VERSION}','2.4.0.1')
                  assert rel in names, rel
                  assert hashlib.sha256(z.read(rel)).hexdigest()==spec['sha256'], rel
              core=z.read('mods/2.4.0.1/tv.protanki.gunmarkscalc_8.1.01.wotmod')
          open('/tmp/core.wotmod','wb').write(core)
          with zipfile.ZipFile('/tmp/core.wotmod') as c:
              assert all(i.compress_type==zipfile.ZIP_STORED for i in c.infolist())
              assert 'res/gui/flash/protanki_gunmarks_battle.swf' in c.namelist()
              assert 'res/mods/cnbox.moe/NOTICE.txt' in c.namelist()

          with zipfile.ZipFile(payload) as z:
              assert 'mods/configs/protanki/gunMarksCalculator.json' in z.namelist()
              cfg=z.read('mods/configs/protanki/gunMarksCalculator.json').decode('utf-8-sig')
              assert '"offset"' in cfg
              assert '"anchorPoint"' in cfg

          # Prove the candidate did not touch the calculation/backend archive members.
          # Only the battle SWF is replaced and NOTICE.txt is added.
          upstream=os.environ['RUNNER_TEMP']+'/cnbox-moe/upstream/mods/2.4.0.1/tv.protanki.gunmarkscalc_8.1.01.wotmod'
          with zipfile.ZipFile(upstream) as u, zipfile.ZipFile('/tmp/core.wotmod') as v:
              # Repacking does not preserve upstream's explicit directory entries. Compare
              # FILE members only: the loader consumes files, and our invariant is that every
              # backend file is byte-identical except the one SWF presentation asset.
              unames={i.filename for i in u.infolist() if not i.is_dir()}
              vnames={i.filename for i in v.infolist() if not i.is_dir()}
              allowed_added={'res/mods/cnbox.moe/NOTICE.txt'}
              assert vnames-unames == allowed_added, vnames-unames
              assert unames-vnames == set(), unames-vnames
              for name in sorted(unames):
                  if name == 'res/gui/flash/protanki_gunmarks_battle.swf':
                      continue
                  assert hashlib.sha256(u.read(name)).hexdigest() == hashlib.sha256(v.read(name)).hexdigest(), name
          print('STATIC_MOE_BACKEND_UNCHANGED_OK')

          # Static-only persistence trace. Search the NON-SWF backend members for the
          # configuration/position symbols that bind the Flash updatePosition callback to
          # persistent ProTanki state. This is diagnostic evidence only on this pass; once
          # the exact owner member is identified we can turn it into a locked assertion.
          terms=(b'gunMarksCalculator', b'offsetBattle', b'updatePosition', b'anchorPoint')
          evidence={}
          with zipfile.ZipFile('/tmp/core.wotmod') as z:
              for i in z.infolist():
                  if i.is_dir() or i.filename.endswith('protanki_gunmarks_battle.swf'):
                      continue
                  data=z.read(i.filename)
                  found=[t.decode('ascii') for t in terms if t in data]
                  if found:
                      evidence[i.filename]=found
          print('STATIC_MOE_PERSISTENCE_SYMBOLS='+json.dumps(evidence,sort_keys=True))
          with zipfile.ZipFile('/tmp/core.wotmod') as z:
              py_members=[i.filename for i in z.infolist()
                          if not i.is_dir() and
                          (i.filename.endswith('.pyc') or '/scripts/' in i.filename)]
          print('STATIC_MOE_SCRIPT_MEMBERS='+json.dumps(sorted(py_members)))
          print('STATIC_MOE_PAYLOAD_OK')
          PY

      - name: Commit deterministic candidate
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add moe/1.0.1
          if git diff --cached --quiet; then
            echo 'No output changes.'
            exit 0
          fi
          git commit -m 'Build CNBOX standalone MoE 1.0.1 candidate'
          git push origin HEAD:work/moe-component-1.0.1
