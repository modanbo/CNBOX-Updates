name: Probe MoE battle panel variants

on:
  push:
    branches:
      - work/moe-component-1.1.2-battle-owner
    paths:
      - '.github/workflows/probe-moe-battle-variants.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/moe-component-1.1.2-battle-owner
          fetch-depth: 0

      - name: Fetch pinned ProTanki and FFDec
        shell: bash
        run: |
          set -euxo pipefail
          root="$RUNNER_TEMP/moe-battle-variants"
          mkdir -p "$root/protanki" "$root/ffdec" "$root/core" "$root/as"

          curl -fL --retry 3 --connect-timeout 20 \
            'https://repo.aslain.com/wot_modmanager/Files/MarksOnGun/MarksOnGun_Gun_Marks_Calculator_a834e732.zip' \
            -o "$root/protanki.zip"
          echo '3df826d272877fca504b48d968b68e4e82e7118ba7da17c27ae61c5fc24201ee  '"$root"'/protanki.zip' | sha256sum -c -
          unzip -q "$root/protanki.zip" -d "$root/protanki"

          curl -fL --retry 3 --connect-timeout 20 \
            'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.3.0/ffdec_26.3.0.zip' \
            -o "$root/ffdec.zip"
          unzip -q "$root/ffdec.zip" -d "$root/ffdec"
          chmod +x "$root/ffdec/ffdec.sh"

          wotmod="$root/protanki/mods/2.4.0.1/tv.protanki.gunmarkscalc_8.1.01.wotmod"
          unzip -q "$wotmod" -d "$root/core"
          "$root/ffdec/ffdec.sh" -export script "$root/as" "$root/core/res/gui/flash/protanki_gunmarks_battle.swf"

      - name: Record only missing battle variants
        shell: bash
        run: |
          set -euxo pipefail
          src="$RUNNER_TEMP/moe-battle-variants/as/scripts/poliroid/views/battle/gunmarks"
          dest="$GITHUB_WORKSPACE/moe/diagnostics/battle_variants"
          mkdir -p "$dest"
          cp "$src/GunMarksPanelNewSimple.as" "$dest/ORIGINAL_GunMarksPanelNewSimple.as"
          cp "$src/GunMarksPanelOld.as" "$dest/ORIGINAL_GunMarksPanelOld.as"
          cp "$src/IGunMarksPanel.as" "$dest/ORIGINAL_IGunMarksPanel.as"

      - name: Commit targeted diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add moe/diagnostics/battle_variants
          git commit -m 'Archive missing ProTanki battle panel variants'
          git push origin HEAD:work/moe-component-1.1.2-battle-owner
