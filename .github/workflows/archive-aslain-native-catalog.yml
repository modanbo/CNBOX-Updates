name: Archive Aslain native catalog

permissions:
  contents: write

on:
  push:
    paths:
      - ".github/workflows/archive-aslain-native-catalog.yml"
      - "channel.json"
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and archive current Aslain Configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import difflib
          import hashlib
          import json
          import re
          import urllib.request
          from pathlib import Path
          import xml.etree.ElementTree as ET

          channel_path = Path("channel.json")
          channel_text = channel_path.read_text(encoding="utf-8")
          channel = json.loads(channel_text)
          latest = channel.get("latestAslainVersion", "")
          m = re.search(r'(\d+\.\d+\.\d+\.\d+)\s*#\s*(\d{1,3})', latest)
          if not m:
              raise SystemExit("latestAslainVersion is not parseable: " + latest)

          game = m.group(1)
          advertised_build = int(m.group(2))
          url = f"https://repo.aslain.com/wot_modmanager/{game}/Configuration"

          req = urllib.request.Request(url, headers={
              "User-Agent": "NAJXBox-Aslain-Native-Catalog-Archiver/2.0",
              "Cache-Control": "no-cache"
          })
          with urllib.request.urlopen(req, timeout=60) as r:
              data = r.read()

          root = ET.fromstring(data)
          content = root.attrib.get("ContentVersion", "")
          cm = re.search(r'(\d+\.\d+\.\d+\.\d+)\s*#\s*(\d{1,3})', content)
          if not cm:
              raise SystemExit("Configuration ContentVersion is not parseable: " + content)

          config_game = cm.group(1)
          build = int(cm.group(2))
          if config_game != game:
              raise SystemExit(f"Configuration game mismatch: channel={game} config={config_game}")
          if build < advertised_build:
              raise SystemExit(f"Configuration unexpectedly older than channel: channel=#{advertised_build:02d} config=#{build:02d}")

          rootdir = Path("aslain_catalogs")
          previous = []
          for meta_path in sorted(rootdir.glob("*/*/metadata.json")):
              try:
                  item = json.loads(meta_path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              vm = re.search(r'(\d+\.\d+\.\d+\.\d+)\s*#\s*(\d+)', item.get("aslainVersion", ""))
              if vm and vm.group(1) == game and int(vm.group(2)) < build:
                  previous.append((int(vm.group(2)), item, meta_path.parent))
          previous.sort(key=lambda x: x[0])
          prev = previous[-1] if previous else None

          out = rootdir / game / f"{build:02d}"
          out.mkdir(parents=True, exist_ok=True)
          config_path = out / "Configuration"
          config_path.write_bytes(data)

          sha = hashlib.sha256(data).hexdigest()
          meta = {
              "schemaVersion": 2,
              "wotVersion": game,
              "aslainVersion": f"{game} #{build:02d}",
              "contentVersion": content,
              "configurationUrl": f"https://raw.githubusercontent.com/modanbo/CNBOX-Updates/main/aslain_catalogs/{game}/{build:02d}/Configuration",
              "configurationSha256": sha,
              "bytes": len(data)
          }

          if prev:
              prev_build, prev_meta, prev_dir = prev
              prev_bytes = (prev_dir / "Configuration").read_bytes()
              old_lines = prev_bytes.decode("utf-8-sig", errors="replace").splitlines(keepends=True)
              new_lines = data.decode("utf-8-sig", errors="replace").splitlines(keepends=True)
              diff_lines = list(difflib.unified_diff(
                  old_lines,
                  new_lines,
                  fromfile=f"{game} #{prev_build:02d}",
                  tofile=f"{game} #{build:02d}",
                  n=3
              ))
              diff_text = "".join(diff_lines)
              diff_name = f"diff_from_{prev_build:02d}.diff"
              diff_path = out / diff_name
              diff_path.write_text(diff_text, encoding="utf-8")
              changed_old = 0
              changed_new = 0
              hunk_count = 0
              for line in diff_lines:
                  if line.startswith("@@"):
                      hunk_count += 1
                  elif line.startswith("-") and not line.startswith("---"):
                      changed_old += 1
                  elif line.startswith("+") and not line.startswith("+++"):
                      changed_new += 1
              diff_sha = hashlib.sha256(diff_text.encode("utf-8")).hexdigest()
              summary = {
                  "schemaVersion": 1,
                  "wotVersion": game,
                  "fromAslainVersion": f"{game} #{prev_build:02d}",
                  "toAslainVersion": f"{game} #{build:02d}",
                  "fromConfigurationSha256": prev_meta.get("configurationSha256"),
                  "toConfigurationSha256": sha,
                  "fromBytes": len(prev_bytes),
                  "toBytes": len(data),
                  "fromLines": len(old_lines),
                  "toLines": len(new_lines),
                  "diffHunks": hunk_count,
                  "removedLines": changed_old,
                  "addedLines": changed_new,
                  "diffFile": diff_name,
                  "diffSha256": diff_sha
              }
              (out / "diff_summary.json").write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
              meta["previousAslainVersion"] = f"{game} #{prev_build:02d}"
              meta["configurationDiffSha256"] = diff_sha

          (out / "metadata.json").write_text(json.dumps(meta, indent=2) + "\n", encoding="utf-8")

          if build > advertised_build:
              replacement = f'\\g<1>{game} #{build:02d}\\g<2>'
              updated, count = re.subn(
                  r'("latestAslainVersion"\s*:\s*")[^"]+("\s*,)',
                  replacement,
                  channel_text,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Could not update latestAslainVersion in channel.json")
              channel_path.write_text(updated, encoding="utf-8")
              print(f"Upstream advanced: channel #{advertised_build:02d} -> Configuration #{build:02d}")

          entries = []
          for meta_path in sorted(rootdir.glob("*/*/metadata.json")):
              try:
                  entries.append(json.loads(meta_path.read_text(encoding="utf-8")))
              except Exception as e:
                  print("Skipping bad metadata", meta_path, e)

          def key(x):
              vm = re.search(r'(\d+)\.(\d+)\.(\d+)\.(\d+)\s*#\s*(\d+)', x.get("aslainVersion", ""))
              return tuple(map(int, vm.groups())) if vm else (0, 0, 0, 0, 0)

          entries.sort(key=key, reverse=True)
          index = {"schemaVersion": 1, "catalogs": entries}
          (rootdir / "index.json").write_text(json.dumps(index, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(meta, indent=2))
          PY

      - name: Commit archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aslain_catalogs channel.json
          if git diff --cached --quiet; then
            echo "Catalog already archived."
            exit 0
          fi
          git commit -m "Archive current Aslain native catalog"
          git push
