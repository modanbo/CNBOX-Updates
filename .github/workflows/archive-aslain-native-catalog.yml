name: Archive Aslain native catalog

permissions:
  contents: write

on:
  push:
    paths:
      - ".github/workflows/archive-aslain-native-catalog.yml"
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and archive current Aslain Configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, hashlib, urllib.request
          from pathlib import Path
          import xml.etree.ElementTree as ET

          channel = json.loads(Path("channel.json").read_text(encoding="utf-8"))
          latest = channel.get("latestAslainVersion", "")
          m = re.search(r'(\d+\.\d+\.\d+\.\d+)\s*#\s*(\d{1,3})', latest)
          if not m:
              raise SystemExit("latestAslainVersion is not parseable: " + latest)

          game = m.group(1)
          advertised_build = int(m.group(2))
          url = f"https://repo.aslain.com/wot_modmanager/{game}/Configuration"

          req = urllib.request.Request(url, headers={
              "User-Agent": "CNBOX-Aslain-Native-Catalog-Archiver/1.0",
              "Cache-Control": "no-cache"
          })
          with urllib.request.urlopen(req, timeout=60) as r:
              data = r.read()

          root = ET.fromstring(data)
          content = root.attrib.get("ContentVersion", "")
          cm = re.search(r'(\d+\.\d+\.\d+\.\d+)\s*#\s*(\d{1,3})', content)
          if not cm:
              raise SystemExit("Configuration ContentVersion is not parseable: " + content)

          config_game = cm.group(1)
          build = int(cm.group(2))
          if config_game != game:
              raise SystemExit(f"Configuration game mismatch: channel={game} config={config_game}")
          if build != advertised_build:
              raise SystemExit(f"Configuration build mismatch: channel=#{advertised_build:02d} config=#{build:02d}")

          out = Path("aslain_catalogs") / game / f"{build:02d}"
          out.mkdir(parents=True, exist_ok=True)
          config_path = out / "Configuration"
          config_path.write_bytes(data)

          sha = hashlib.sha256(data).hexdigest()
          meta = {
              "schemaVersion": 1,
              "wotVersion": game,
              "aslainVersion": f"{game} #{build:02d}",
              "contentVersion": content,
              "configurationUrl": f"https://raw.githubusercontent.com/modanbo/CNBOX-Updates/main/aslain_catalogs/{game}/{build:02d}/Configuration",
              "configurationSha256": sha,
              "bytes": len(data)
          }
          (out / "metadata.json").write_text(json.dumps(meta, indent=2) + "\n", encoding="utf-8")

          entries = []
          rootdir = Path("aslain_catalogs")
          for meta_path in sorted(rootdir.glob("*/*/metadata.json")):
              try:
                  entries.append(json.loads(meta_path.read_text(encoding="utf-8")))
              except Exception as e:
                  print("Skipping bad metadata", meta_path, e)

          def key(x):
              vm = re.search(r'(\d+)\.(\d+)\.(\d+)\.(\d+)\s*#\s*(\d+)', x.get("aslainVersion", ""))
              return tuple(map(int, vm.groups())) if vm else (0,0,0,0,0)

          entries.sort(key=key, reverse=True)
          index = {"schemaVersion": 1, "catalogs": entries}
          (rootdir / "index.json").write_text(json.dumps(index, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(meta, indent=2))
          PY

      - name: Commit archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aslain_catalogs
          if git diff --cached --quiet; then
            echo "Catalog already archived."
            exit 0
          fi
          git commit -m "Archive current Aslain native catalog"
          git push
