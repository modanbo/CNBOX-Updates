name: build-moe-original-lobby-visibility-helper
on:
  push:
    paths:
      - '.github/workflows/build-moe-original-lobby-visibility-helper.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write helper source
        shell: bash
        run: |
          mkdir -p out
          cat > out/mod_najxbox_moe_lobby_visibility.py <<'PY'
          # -*- coding: utf-8 -*-
          import traceback

          _TAG = '[NAJXBox.MoE.Visibility]'
          _LOBBY_ALIAS = 'NAJXBOX_MOE_INDEPENDENT_LOBBY'
          _LAST_HANGAR_VISIBLE = None

          try:
              from gui.lobby_state_machine.lobby_state_machine import LobbyStateMachine
              from gui.Scaleform.framework import WindowLayer
              from gui.Scaleform.framework.managers.containers import POP_UP_CRITERIA
              from gui.app_loader.settings import APP_NAME_SPACE
              from gui.shared.personality import ServicesLocator
          except Exception:
              print _TAG, 'import failed'
              traceback.print_exc()
              LobbyStateMachine = None

          def _leaf_state(machine):
              try:
                  states = machine.getNonEmptyEnteredStates()
                  if states:
                      return states[-1]
              except Exception:
                  print _TAG, 'get leaf state failed'
                  traceback.print_exc()
              return None

          def _state_id(state):
              try:
                  return str(getattr(state, 'STATE_ID', '')).lower()
              except Exception:
                  return ''

          def _lobby_view():
              try:
                  app = ServicesLocator.appLoader.getApp(APP_NAME_SPACE.SF_LOBBY)
                  if app is None:
                      print _TAG, 'SF_LOBBY app not ready'
                      return None
                  manager = getattr(app, 'containerManager', None)
                  if manager is None:
                      print _TAG, 'containerManager not ready'
                      return None
                  criteria = {POP_UP_CRITERIA.VIEW_ALIAS: _LOBBY_ALIAS}
                  return manager.getView(WindowLayer.WINDOW, criteria)
              except Exception:
                  print _TAG, 'find lobby view failed'
                  traceback.print_exc()
                  return None

          def _apply(visible, returning_to_hangar):
              view = _lobby_view()
              if view is None:
                  print _TAG, 'lobby view not found'
                  return
              try:
                  fn = getattr(view, '_apply_hangar_visibility', None)
                  if fn is not None:
                      fn(bool(visible))
                      print _TAG, 'APPLY', bool(visible), 'via view'
                  else:
                      flash = getattr(view, 'flashObject', None)
                      if flash is None:
                          print _TAG, 'flash object not ready'
                          return
                      if visible:
                          flash.as_showLobbyPanel()
                          print _TAG, 'SHOW direct'
                      else:
                          flash.as_hideLobbyPanel()
                          print _TAG, 'HIDE direct'

                  # Exact 1.2.4 refresh path: _on_vehicle() -> _push('vehicle-changed')
                  # Only fire on non-Hangar -> Hangar transition, not initial populate.
                  if visible and returning_to_hangar:
                      refresh = getattr(view, '_on_vehicle', None)
                      if refresh is not None:
                          refresh()
                          print _TAG, 'REFRESH vehicle-changed on hangar return'
                      else:
                          push = getattr(view, '_push', None)
                          if push is not None:
                              push('hangar-return')
                              print _TAG, 'REFRESH push on hangar return'
              except Exception:
                  print _TAG, 'apply/refresh visibility failed'
                  traceback.print_exc()

          if LobbyStateMachine is not None:
              try:
                  _ORIGINAL_UPDATE_VISIBLE_ROUTE = LobbyStateMachine._LobbyStateMachine__updateVisibleRoute

                  def _najx_update_visible_route(self):
                      global _LAST_HANGAR_VISIBLE
                      result = _ORIGINAL_UPDATE_VISIBLE_ROUTE(self)
                      try:
                          state = _leaf_state(self)
                          sid = _state_id(state)
                          visible = bool(sid and 'hangar' in sid)
                          returning = (_LAST_HANGAR_VISIBLE is False and visible is True)
                          print _TAG, 'route=', sid, 'hangar=', visible, 'returning=', returning
                          _apply(visible, returning)
                          _LAST_HANGAR_VISIBLE = visible
                      except Exception:
                          print _TAG, 'route update failed'
                          traceback.print_exc()
                      return result

                  LobbyStateMachine._LobbyStateMachine__updateVisibleRoute = _najx_update_visible_route
                  print _TAG, 'criteria-view+return-refresh installed'
              except Exception:
                  print _TAG, 'hook install failed'
                  traceback.print_exc()
          PY

      - name: Compile with CPython 2.7
        shell: bash
        run: |
          docker run --rm -v "$PWD/out:/out" python:2.7-slim sh -lc "python -m py_compile /out/mod_najxbox_moe_lobby_visibility.py && python - <<'PY'
          import hashlib
          p='/out/mod_najxbox_moe_lobby_visibility.pyc'
          d=open(p,'rb').read()
          print('PYC_MAGIC=' + d[:4].encode('hex'))
          print('PYC_SHA256=' + hashlib.sha256(d).hexdigest())
          PY"
          test "$(xxd -p -l 4 out/mod_najxbox_moe_lobby_visibility.pyc)" = "03f30d0a"
          rm out/mod_najxbox_moe_lobby_visibility.py

      - name: Upload compiled helper
        uses: actions/upload-artifact@v4
        with:
          name: moe-original-lobby-visibility-pyc
          path: out/mod_najxbox_moe_lobby_visibility.pyc
          if-no-files-found: error
