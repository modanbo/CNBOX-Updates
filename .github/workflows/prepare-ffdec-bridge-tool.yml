name: Prepare FFDec bridge analysis tool

on:
  workflow_dispatch:
  push:
    branches:
      - work/moe-component-1.1.3-cn-host-na-data-bridge
    paths:
      - '.github/workflows/prepare-ffdec-bridge-tool.yml'

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned FFDec
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --connect-timeout 20 \
            'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.3.0/ffdec_26.3.0.zip' \
            -o ffdec.zip
          echo '35f4930eb7c380afe66f2117f90b006deac0631473ad7500bb39c78f68645ecd  ffdec.zip' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: FFDEC_26_3_0_BRIDGE_TOOL
          path: ffdec.zip
          if-no-files-found: error
