name: Publish Manager 2.1.2 Final

on:
  push:
    branches: [main]
    paths:
      - ".publisher/release-manager-2.1.2.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-manager-2.1.2-final
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish exact frozen Manager 2.1.2 Public and Creator
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $req = [IO.File]::ReadAllText(".publisher/release-manager-2.1.2.json",[Text.Encoding]::UTF8) | ConvertFrom-Json
          if ($req.schemaVersion -ne 1) { throw "Unsupported request schema." }
          if ($req.active -eq $false) { Write-Host "Inactive request."; exit 0 }

          $zip = Join-Path $env:RUNNER_TEMP "manager212.zip"
          $out = Join-Path $env:RUNNER_TEMP "manager212"
          Invoke-WebRequest -Uri $req.artifactUrl -OutFile $zip -UseBasicParsing

          $zipSha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipSha -ne ([string]$req.artifactSha256).ToLowerInvariant()) {
            throw "Manager artifact ZIP SHA mismatch: $zipSha"
          }

          Expand-Archive $zip $out -Force
          $pub=Join-Path $out "Public/NAJXBox_Manager_2.1.2_Public.exe"
          $cre=Join-Path $out "Creator/NAJXBox_Manager_2.1.2_Creator.exe"
          if (!(Test-Path $pub) -or !(Test-Path $cre)) { throw "Manager artifact structure invalid." }

          $pubSha=(Get-FileHash $pub -Algorithm SHA256).Hash.ToLowerInvariant()
          $creSha=(Get-FileHash $cre -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($pubSha -ne ([string]$req.publicSha256).ToLowerInvariant()) { throw "Public SHA mismatch: $pubSha" }
          if ($creSha -ne ([string]$req.creatorSha256).ToLowerInvariant()) { throw "Creator SHA mismatch: $creSha" }

          New-Item "manager" -ItemType Directory -Force | Out-Null
          Copy-Item $pub "manager/NAJXBox_Manager.exe" -Force
          Copy-Item $pub "manager/CNBOX_Manager.exe" -Force
          Copy-Item $pub "manager/NAJXBox_Manager_v2.1.2.exe" -Force
          Copy-Item $cre "manager/NAJXBox_Manager_Creator.exe" -Force
          Copy-Item $cre "manager/CNBOX_Manager_Creator.exe" -Force
          Copy-Item $cre "manager/NAJXBox_Manager_Creator_v2.1.2.exe" -Force

          $channel=[IO.File]::ReadAllText("channel.json",[Text.Encoding]::UTF8) | ConvertFrom-Json
          $channel.managerVersion="2.1.2"
          $channel.managerUrl="https://raw.githubusercontent.com/modanbo/CNBOX-Updates/main/manager/NAJXBox_Manager.exe"
          $channel.managerSha256=$pubSha
          $channel.creatorManagerVersion="2.1.2"
          $channel.creatorManagerUrl="https://raw.githubusercontent.com/modanbo/CNBOX-Updates/main/manager/NAJXBox_Manager_Creator.exe"
          $channel.creatorManagerSha256=$creSha
          $json=$channel | ConvertTo-Json -Depth 100
          [IO.File]::WriteAllText((Resolve-Path "channel.json"),$json,(New-Object Text.UTF8Encoding($false)))

          @"
# NAJXBox Manager - Current Public Files

Current version: **2.1.2**

Exact frozen source:
- source head: $($req.sourceManagerCommit)
- source run: $($req.sourceManagerRun)
- Public SHA256: $pubSha
- Creator SHA256: $creSha
- Public Build/SelfTest/UI: PASS
- Creator Build/SelfTest/UI: PASS
- Review 1 / Review 2: PASS

Release policy:
- Defender: NOT_REQUIRED
- VirusTotal: NOT_REQUIRED
- Authenticode: NOT_REQUIRED
- exact SHA256 is the binary identity.

Stable aliases:
- NAJXBox_Manager.exe
- CNBOX_Manager.exe
- NAJXBox_Manager_Creator.exe
- CNBOX_Manager_Creator.exe
"@ | Set-Content "manager/README.md" -Encoding UTF8

          git config user.name "NAJXBox Release Bot"
          git config user.email "najxbox-release-bot@users.noreply.github.com"
          git add -- channel.json manager
          git status --short
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "release: publish Manager 2.1.2 Public and Creator"
            if ($LASTEXITCODE -ne 0) { throw "git commit failed" }
            git -c http.version=HTTP/1.1 push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw "git push failed" }
          } elseif ($LASTEXITCODE -ne 0) {
            throw "git diff failed"
          }

          Write-Host "MANAGER_2.1.2_PUBLISH_PASS"
          Write-Host "PublicSHA256=$pubSha"
          Write-Host "CreatorSHA256=$creSha"
