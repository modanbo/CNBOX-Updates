name: Build MoE 1.2.0 offline threshold snapshot

on:
  push:
    branches:
      - work/moe-component-1.2.0-full-rebuild
    paths:
      - '.github/workflows/build-moe-120-threshold-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/moe-component-1.2.0-full-rebuild
          fetch-depth: 1

      - name: Fetch NA MoE page
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --connect-timeout 20 -A 'Mozilla/5.0' \
            'https://tomato.gg/moe/NA' -o "$RUNNER_TEMP/moe-na.html"

      - name: Parse and validate snapshot
        id: parse
        shell: bash
        run: |
          set +e
          python3 - "$RUNNER_TEMP/moe-na.html" <<'PY'
          import datetime
          import hashlib
          import html
          import json
          import os
          import re
          import sys

          src_path=sys.argv[1]
          raw=open(src_path,'rb').read()
          page=raw.decode('utf-8','replace')
          page_sha=hashlib.sha256(raw).hexdigest()
          URL='https://tomato.gg/moe/NA'

          updated=''
          m=re.search(r'Last Update:\s*(?:<!--.*?-->\s*)*([^<]+)',page,re.I|re.S)
          if m:
              updated=html.unescape(m.group(1)).strip()

          tr_re=re.compile(r'<tr\b[^>]*>(.*?)</tr>',re.I|re.S)
          td_re=re.compile(r'<td\b[^>]*>(.*?)</td>',re.I|re.S)
          img_re=re.compile(r'/contour/([^"\'<>]+?)\.png',re.I)

          def cell_text(fragment):
              fragment=re.sub(r'<script\b.*?</script>','',fragment,flags=re.I|re.S)
              fragment=re.sub(r'<style\b.*?</style>','',fragment,flags=re.I|re.S)
              fragment=re.sub(r'<[^>]+>',' ',fragment)
              return ' '.join(html.unescape(fragment).split())

          def number(fragment):
              text=cell_text(fragment).replace(',','')
              m=re.search(r'-?\d+(?:\.\d+)?',text)
              return int(round(float(m.group(0)))) if m else None

          rows={}
          bad=[]
          candidate_rows=0

          # The complete loader dataset is serialized as many flat objects:
          # $R[n]={65:...,85:...,95:...,100:..., ... image:".../contour/X.png"}
          # Split object records first, then read fields independently so field
          # order additions do not break the snapshot parser.
          obj_start=re.compile(r'\$R\[\d+\]=\{65:')
          starts=[m.start() for m in obj_start.finditer(page)]
          for pos_idx,pos in enumerate(starts):
              next_pos=starts[pos_idx+1] if pos_idx+1 < len(starts) else min(len(page),pos+6000)
              chunk=page[pos:next_pos]
              m65=re.search(r'\{65:(\d+)',chunk)
              m85=re.search(r',85:(\d+)',chunk)
              m95=re.search(r',95:(\d+)',chunk)
              m100=re.search(r',100:(\d+)',chunk)
              mim=re.search(r'image:"[^"]*/contour/([^"]+?)\.png"',chunk)
              if not (m65 and m85 and m95 and m100 and mim):
                  continue
              candidate_rows += 1
              v65,v85,v95,v100=[int(x.group(1)) for x in (m65,m85,m95,m100)]
              filename=mim.group(1)
              if '-' not in filename:
                  bad.append((filename,'bad-tech-key',[]))
                  continue
              nation,veh=filename.split('-',1)
              tech=nation.lower()+':'+veh
              vals=[v65,v85,v95,v100]
              if min(vals)<=0 or not (v65<=v85<=v95<=v100):
                  bad.append((tech,'invalid-order',vals))
                  continue
              row={'65':v65,'85':v85,'95':v95,'100':v100}
              if tech in rows and rows[tech] != row:
                  bad.append((tech,'duplicate-conflict',vals))
                  continue
              rows[tech]=row

          reasons=[]
          if page.count('initialChangeData') < 1:
              reasons.append('initialChangeData_missing')
          if len(rows)<700:
              reasons.append('too_few_rows=%d'%len(rows))
          if len(bad)>10:
              reasons.append('too_many_bad_rows=%d'%len(bad))
          if not updated:
              reasons.append('last_update_unparsed')

          status='PASS' if not reasons else 'FAIL'
          fetched=datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat()
          snapshot={
              'schema':1,
              'region':'NA',
              'source':'Tomato.gg MoE requirements',
              'source_url':URL,
              'source_last_update':updated,
              'fetched_at_utc':fetched,
              'source_page_sha256':page_sha,
              'key_type':'wot_vehicle_type_name',
              'table':dict(sorted(rows.items()))
          }
          encoded=(json.dumps(snapshot,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode('utf-8')
          snap_sha=hashlib.sha256(encoded).hexdigest()

          os.makedirs('moe/rebuild/1.2.0/assets',exist_ok=True)
          if status=='PASS':
              open('moe/rebuild/1.2.0/assets/thresholds.json','wb').write(encoded)
          elif os.path.exists('moe/rebuild/1.2.0/assets/thresholds.json'):
              os.remove('moe/rebuild/1.2.0/assets/thresholds.json')

          report=[
              '# MoE 1.2.0 offline threshold snapshot probe',
              '',
              'status: '+status,
              'source_url: '+URL,
              'source_last_update: '+(updated or 'UNPARSED'),
              'source_page_sha256: '+page_sha,
              'hydration_initialChangeData_count: '+str(page.count('initialChangeData')),
              'candidate_rows: '+str(candidate_rows),
              'valid_rows: '+str(len(rows)),
              'invalid_rows: '+str(len(bad)),
              'snapshot_sha256: '+snap_sha,
              'key_type: wot_vehicle_type_name',
              'reasons: '+(', '.join(reasons) if reasons else 'none'),
              '',
              'usa:A194_AHT_7: '+repr(rows.get('usa:A194_AHT_7','NOT_FOUND')),
              'ussr:R157_Object_279R: '+repr(rows.get('ussr:R157_Object_279R','NOT_FOUND')),
          ]
          if bad:
              report += ['', 'First invalid rows:']
              report += [repr(x) for x in bad[:20]]
          open('moe/rebuild/1.2.0/THRESHOLD_SNAPSHOT_PROVENANCE.md','w',encoding='utf-8',newline='\n').write('\n'.join(report)+'\n')
          print('\n'.join(report))
          open('/tmp/moe120-threshold-status','w').write(status)
          PY
          exit 0

      - name: Commit diagnostic or validated snapshot
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f moe/rebuild/1.2.0/THRESHOLD_SNAPSHOT_PROVENANCE.md
          if [ -f moe/rebuild/1.2.0/assets/thresholds.json ]; then
            git add -f moe/rebuild/1.2.0/assets/thresholds.json
          fi
          if git diff --cached --quiet; then
            echo 'No threshold snapshot delta.'
          else
            git commit -m 'MoE 1.2.0: record offline NA threshold snapshot probe'
            git push origin HEAD:work/moe-component-1.2.0-full-rebuild
          fi

      - name: Enforce snapshot gate
        shell: bash
        run: |
          set -euxo pipefail
          test "$(cat /tmp/moe120-threshold-status)" = "PASS"
          test -f moe/rebuild/1.2.0/assets/thresholds.json
