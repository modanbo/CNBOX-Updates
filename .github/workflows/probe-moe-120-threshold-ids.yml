name: Probe MoE 1.2.0 threshold tank IDs

on:
  push:
    branches:
      - work/moe-component-1.2.0-full-rebuild
    paths:
      - '.github/workflows/probe-moe-120-threshold-ids.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/moe-component-1.2.0-full-rebuild
          fetch-depth: 0

      - name: Inspect embedded IDs and route code
        shell: bash
        run: |
          set -euxo pipefail
          root="$RUNNER_TEMP/moe120ids"
          mkdir -p "$root"
          curl -fL --retry 3 --connect-timeout 20 -A 'Mozilla/5.0' 'https://tomato.gg/moe/NA' -o "$root/page.html"
          curl -fL --retry 3 --connect-timeout 20 -A 'Mozilla/5.0' 'https://tomato.gg/assets/moe._server-D6m2IPeL.js' -o "$root/moe.js" || true

          python3 - "$root/page.html" "$root/moe.js" "$GITHUB_WORKSPACE/moe/rebuild/1.2.0/THRESHOLD_ID_PROBE.txt" <<'PY'
          import re,sys,html
          page=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          js=open(sys.argv[2],encoding='utf-8',errors='replace').read() if __import__('os').path.isfile(sys.argv[2]) else ''
          out=[]
          for srcname,src in [('PAGE',page),('JS',js)]:
              out.append('## '+srcname+' bytes='+str(len(src)))
              for pat in ['tankId','tank_id','vehicleId','vehicle_id','compactDescr','intCD','moe','requirements','/api/']:
                  out.append('%s count=%d'%(pat,src.count(pat)))
              for needle in ['M47 Chevalier','Ares MTB','55377','69921','R157_Object_279R']:
                  idx=src.find(needle)
                  if idx>=0:
                      out.append('\nSNIP '+needle+'\n'+html.unescape(src[max(0,idx-1200):idx+2200]))
              out.append('')
          open(sys.argv[3],'w',encoding='utf-8').write('\n'.join(out))
          PY

      - name: Commit ID probe
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add moe/rebuild/1.2.0/THRESHOLD_ID_PROBE.txt
          git commit -m 'Probe MoE threshold tank ID mapping'
          git push origin HEAD:work/moe-component-1.2.0-full-rebuild
