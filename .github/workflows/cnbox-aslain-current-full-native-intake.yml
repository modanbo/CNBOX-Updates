name: CNBOX Aslain current full native source intake for Drive (read-only)
permissions:
  contents: read
on:
  push:
    paths:
      - '.github/workflows/cnbox-aslain-current-full-native-intake.yml'
  workflow_dispatch:
jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Official SHA / native ContentVersion / pristine Inno extraction
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $ProgressPreference='SilentlyContinue'
          $build='01'; $game='2.4.1.1'
          $advertised='1110c3fd0ea260421d73d3e44c258efec051a65702d1321fb014765373e7f34b'
          $expectedNative='543ec42fd2438b067624955c25044c376a1aa8ee0c6d2854038eb0ba9c477214' # live #01 independently observed and original archived for review
          New-Item -ItemType Directory -Force -Path 'work','tool','out','evidence','original' | Out-Null
          $name=('Aslains_WoT_Modpack_Installer_v.{0}_{1}.exe' -f $game,$build)
          $nativeUrl='https://repo.aslain.com/wot_modmanager/2.4.1.1/Configuration'
          Invoke-WebRequest -Uri $nativeUrl -OutFile 'original/Configuration' -TimeoutSec 180
          $nativeSha=(Get-FileHash -Algorithm SHA256 -LiteralPath 'original/Configuration').Hash.ToLowerInvariant()
          [xml]$config=Get-Content 'original/Configuration' -Raw -Encoding UTF8
          $nativeVersion=$config.DocumentElement.GetAttribute('ContentVersion')
          $probe=[ordered]@{timeUTC=(Get-Date).ToUniversalTime().ToString('o');url=$nativeUrl;ContentVersion=$nativeVersion;sha256=$nativeSha;bytes=(Get-Item 'original/Configuration').Length;sourceStatus='RAW_LIVE_NATIVE_FETCH_OK';scope='READ_ONLY_UPSTREAM_NOT_RUNTIME'}
          ($probe|ConvertTo-Json)|Set-Content -Encoding UTF8 evidence/NATIVE2411_SOURCE_PROBE.json
          if($nativeVersion -notmatch '2\.4\.1\.1\s*#\s*0?1\b' -or ($expectedNative -and $nativeSha -ne $expectedNative)){throw ('NATIVE_2411_01_VERSION_SHA_MISMATCH '+$nativeVersion+' / '+$nativeSha)}
          Write-Host ('NATIVE_2411_01_CONFIG_PASS '+$nativeVersion+' SHA '+$nativeSha)
          $exe=Join-Path 'work' $name
          $officialUrl=('https://filez.aslain.com/'+$name)
          Invoke-WebRequest -Uri $officialUrl -OutFile $exe -TimeoutSec 180
          $sha=(Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          $sz=(Get-Item $exe).Length
          if($sha -ne $advertised -or $sz -lt 70000000){throw ('OFFICIAL_2411_01_SHA_SIZE_GATE_FAIL '+$sha+' / '+$sz)}
          Copy-Item -LiteralPath $exe -Destination (Join-Path 'original' $name)
          Write-Host ('OFFICIAL_2411_01_RAW_PASS '+$sz+' '+$sha)
          $extractCommit='6fb49264aacf512a093e7b4fc6fb3dd266dad31a'
          $toolUrl=('https://raw.githubusercontent.com/jrathlev/InnoUnpacker-Windows-GUI/'+$extractCommit+'/innounp-2/bin/innounp-2.zip')
          Invoke-WebRequest -Uri $toolUrl -OutFile 'tool/innounp-2.zip' -TimeoutSec 180
          $toolSha=(Get-FileHash -Algorithm SHA256 -LiteralPath 'tool/innounp-2.zip').Hash.ToLowerInvariant()
          if($toolSha -ne 'f2f037fdbc63de31248efae9ccb294398d160dc0cbad5f36d14c2f159e17bbf5'){throw ('EXTRACTOR_SHA_MISMATCH '+$toolSha)}
          Expand-Archive tool/innounp-2.zip -DestinationPath tool/innounp -Force
          $iu=(Get-ChildItem tool/innounp -Recurse -Filter innounp.exe | Select-Object -First 1).FullName
          if(-not $iu){throw 'EXTRACTOR_MISSING'}
          & $iu -h -o -b -y -q -a -m -x '-dout' $exe 2>&1 | Out-File -Encoding utf8 evidence/EXTRACTOR.log
          if($LASTEXITCODE -ne 0){throw ('EXTRACT_FAILURE '+$LASTEXITCODE)}
          $all=@(Get-ChildItem out -File -Recurse)
          if($all.Count -lt 10000){throw ('INCOMPLETE_EXTRACTION_COUNT '+$all.Count)}
          $root=(Resolve-Path out).Path
          $rows=@(foreach($f in $all){
             $rel=$f.FullName.Substring($root.Length+1).Replace('\','/')
             $h=(Get-FileHash -Algorithm SHA256 -LiteralPath $f.FullName).Hash.ToLowerInvariant()
             ($rel+[char]9+$f.Length+[char]9+$h)
          })
          $rows | Sort-Object | Set-Content -Encoding UTF8 evidence/FULL_NATIVE_PATH_SHA256.tsv
          $iss=@(Get-ChildItem out -Recurse -File -Filter install_script.iss)
          if($iss.Count -ne 1){throw ('INNO_SCRIPT_EXPECTED_ONCE_'+$iss.Count)}
          Copy-Item -LiteralPath $iss[0].FullName -Destination evidence/install_script.iss
          $interesting=$rows | Where-Object {$_ -match '(?i)openwg|xvm_13|battlevehiclemarkers|playerspanel|battleloading|limpidstickers|modmenu|modssettingsbridge|armor_penetration|customuiscale|customsixthsense|minimap'}
          $interesting | Set-Content -Encoding UTF8 evidence/BOX_AND_SELECTED_NATIVE_OWNERS.tsv
          $report=[ordered]@{work='ASLAIN2411_01_CHOICE36_NATIVE_FULL_INTAKE';upstream='2.4.1.1 #01';status='FULL_NATIVE_SOURCE_INVENTORY_PASS_NOT_RUNTIME';installerName=$name;installerBytes=$sz;installerSHA256=$sha;officialAdvertisedSHA256=$advertised;nativeContentVersion=$nativeVersion;nativeSHA256=$nativeSha;nativeBytes=(Get-Item original/Configuration).Length;extractedFileCount=$all.Count;extractorCommit=$extractCommit;extractorSHA256=$toolSha;installerSourceUrl=$officialUrl;nativeSourceUrl=$nativeUrl;choiceOriginalDriveId='1_PGX-1iT5siz9ZIjQfsDXxiWNzdoHDVW';choiceOriginalSHA256='aa54b627c2a91aed4f23badddf7436810d43a793bb5bce170d2c59770f88624f';formalBoxSHA256='ce38abf70ca43b443810a375d067367622b5cac96263511cef63c0b9186be36f';selectedChoiceFinalOwnerAudit='PENDING_INDEPENDENT_TWO_REVIEW';gameRuntime='NOT_TESTED';physicalCreatorRollback='NOT_TESTED';formalModuleReleaseChanged=$false}
          ($report | ConvertTo-Json -Depth 5) | Set-Content -Encoding UTF8 evidence/NATIVE2411_01_SUMMARY.json
          Copy-Item -LiteralPath 'evidence/NATIVE2411_01_SUMMARY.json' -Destination 'original/NATIVE2411_01_SUMMARY.json'
          Write-Host ('FULL_NATIVE_2411_01_COUNT '+$all.Count)
          New-Item -ItemType Directory -Force -Path 'shared_owner' | Out-Null
          $want=@(
            @{source='{app}/mods/2.4.1.1/com.modxvm.xvm_14.0.0.0004.wotmod'; out='CLEAN_XVM_14_0_0_0004.wotmod'; sha='2245f772720a802ddf2c41c634092cd9c20059dd1b7d0278d882f577c10937af'},
            @{source='{app}/mods/2.4.1.1/net.openwg/net.openwg.common_2.8.5.0000,1.wotmod'; out='CLEAN_OPENWG_COMMON_2_8_5.wotmod'; sha='f4680bb95857a7cbdb594ff7318c07784459fe5c316a52cb6a9f06c5b7917f37'},
            @{source='{app}/res_mods/2.4.1.1/gui/flash/battleVehicleMarkersApp.swf'; out='CLEAN_BATTLE_VEHICLE_MARKERS.swf'; sha='315a9b2a4159f104e7770b1f4ad5283011ea53874c85b94a5c950db53186cf01'}
          )
          $ownerRecords=@()
          foreach($obj in $want){
            $path=Join-Path 'out' ($obj.source.Replace('/','\'))
            if(!(Test-Path -LiteralPath $path)){throw ('OWNER_ORIGINAL_NOT_EXTRACTED '+$obj.source)}
            $computed=(Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if($computed -ne $obj.sha){throw ('OWNER_HASH_MISMATCH '+$obj.source)}
            Copy-Item -LiteralPath $path -Destination (Join-Path 'shared_owner' $obj.out)
            $ownerRecords+=($obj.source+[char]9+(Get-Item -LiteralPath $path).Length+[char]9+$computed)
            Write-Host ('CLEAN_ORIGINAL_SHARED_OWNER_PASS '+$obj.source+' SHA '+$computed)
          }
          $ownerRecords | Set-Content -Encoding UTF8 shared_owner/SHARED_OWNER_SOURCE_SHA256.tsv

      - name: Preserve official original/Configuration for Drive even if installer source currently 404
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CNBOX-Aslain2411-01-raw-EXE-native-Drive-handoff
          path: original/
          retention-days: 2
          if-no-files-found: error
      - name: Preserve shared clean native originals for interface-only review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CNBOX-Aslain2411-01-shared-native-originals
          path: shared_owner/
          retention-days: 1
          if-no-files-found: error
      - name: Full pristine native evidence - ephemeral Drive handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CNBOX-Aslain2411-01-full-native-teardown
          path: evidence/
          retention-days: 2
          if-no-files-found: error
