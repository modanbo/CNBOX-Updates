name: Publish Language 1.1.2 Exact

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-current-locked-modules.yml'
  workflow_dispatch:

concurrency:
  group: publish-language-1-1-2-exact
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download exact locked Language 1.1.2 and publish current channel
        shell: powershell
        env:
          LANGUAGE_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-ea2c-81fd-bff6-32f57bbfb070/raw?se=2026-10-05T00%3A57%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=58d2dbcc-2762-5db7-8ffa-726d94db4d55&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T13%3A58%3A18Z&ske=2026-10-05T13%3A58%3A18Z&sks=b&skv=2026-02-06&sig=kvRl%2BL/b9rYB6roBtVPG6WcrJnAh5pJAM%2BxdIF%2BLfqY%3D'
          LANGUAGE_SHA: '1f2fa9c38f9029dba2a3ef3e2660fa828b3760f4e0c5958c1e26818300442f18'
        run: |
          $ErrorActionPreference='Stop'
          $NL=[Environment]::NewLine
          function Write-Utf8NoBom([string]$Path,[string]$Text) {
            [IO.File]::WriteAllText($Path,$Text,(New-Object Text.UTF8Encoding($false)))
          }

          $tmp=Join-Path $env:RUNNER_TEMP 'NAJXBOX_LANGUAGE_1.1.2_WOT_2.4.0.2_FINAL_LOCK.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $env:LANGUAGE_URL -OutFile $tmp
          $actual=(Get-FileHash -LiteralPath $tmp -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $env:LANGUAGE_SHA){throw "Language SHA mismatch: $actual"}

          $dst='language/NAJXBOX_LANGUAGE_1.1.2_WOT_2.4.0.2_FINAL_LOCK.zip'
          Copy-Item -LiteralPath $tmp -Destination $dst -Force
          if((Get-FileHash -LiteralPath $dst -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:LANGUAGE_SHA){throw 'Copied Language SHA mismatch'}

          foreach($old in @(
            'language/NAJXBOX_LANGUAGE_1.1.1_WOT_2.4.0.2_FINAL_LOCK.zip',
            'language/NAJXBOX_LANGUAGE_1.1.1_WOT_2.4.0.2_FINAL_LOCK.zip.sha256.txt'
          )) {
            if(Test-Path -LiteralPath $old){Remove-Item -LiteralPath $old -Force}
          }

          Write-Utf8NoBom 'language/NAJXBOX_LANGUAGE_1.1.2_WOT_2.4.0.2_FINAL_LOCK.zip.sha256.txt' ($env:LANGUAGE_SHA+'  NAJXBOX_LANGUAGE_1.1.2_WOT_2.4.0.2_FINAL_LOCK.zip'+$NL)

          $channel=[IO.File]::ReadAllText((Resolve-Path 'channel.json'),[Text.Encoding]::UTF8) | ConvertFrom-Json
          if([string]$channel.managerVersion -ne '2.1.5'){throw 'Manager current changed unexpectedly'}
          if([string]$channel.releases[0].payloadSha256 -ne 'b40c9b17b8ac42806b857bb92120e2ebc36148498ff28a6c046d72890d7406f2'){throw 'Box current changed unexpectedly'}
          if([string]$channel.moePacks[0].payloadSha256 -ne '5d6bcfc871fdec58f8c8195eaecb0b9351a980ea917f3c054c0de66ebb134e19'){throw 'MoE current changed unexpectedly'}

          $raw='https://raw.githubusercontent.com/modanbo/CNBOX-Updates/main'
          $lang=[pscustomobject][ordered]@{
            packVersion='1.1.2'
            wotVersion='2.4.0.2'
            payloadUrl="$raw/language/NAJXBOX_LANGUAGE_1.1.2_WOT_2.4.0.2_FINAL_LOCK.zip"
            payloadSha256=$env:LANGUAGE_SHA
            notes='FINAL_LOCK. Current-NA-key authoritative global completeness + same-key CN fallback + current-NA vehicle-name standardization with CN Box JX compact-display cross-check. R7 real-client Runtime PASS; final 1.1.2 differs from tested R7 only by release-identity manifest. Review 5 + Review 6 + Final Review 1 + Final Review 2 PASS.'
          }
          $channel.languagePacks=@($lang)
          Write-Utf8NoBom 'channel.json' (($channel|ConvertTo-Json -Depth 100)+$NL)

          $index=[IO.File]::ReadAllText((Resolve-Path 'CURRENT_RELEASE_INDEX.md'),[Text.Encoding]::UTF8)
          $index=[regex]::Replace($index,'(?m)^Updated: .*$', 'Updated: 2026-10-04')
          $index=[regex]::Replace($index,'(?m)^- Language: .*$','- Language: 1.1.2 / '+$env:LANGUAGE_SHA)
          Write-Utf8NoBom 'CURRENT_RELEASE_INDEX.md' $index

          $readme=@"
# NAJXBox Language Packs

Current authority: ../channel.json.

## Current language authority

- formal version: **1.1.2**
- WoT: 2.4.0.2
- package: NAJXBOX_LANGUAGE_1.1.2_WOT_2.4.0.2_FINAL_LOCK.zip
- SHA256: $env:LANGUAGE_SHA
- enhanced TahomaZH SHA256: 108e0ae0dbd7ad0330114cf082bdc33ecdae30aa6dcb3cb3b1a82dae75331b45
- global UI completeness: 521 current-NA exact-key replacements
- vehicle-name layer: current NA identity authority + exact same-key CN donor + CN Box JX 80x24 compact-display cross-check
- Runtime: R7 real-client PASS; final 1.1.2 payload members are byte-identical to R7 except language_pack_manifest.json release identity
- Review: R7 Review 5 PASS + Review 6 PASS + Final Review 1 PASS + Final Review 2 PASS

## Manager language modes

- 中文界面 + 中文坦克名
- 中文界面 + 英文坦克名
- 恢复原始语言

Only current-NA keys/vehicles are eligible. CN-only vehicles/events/keys are not imported.
"@
          Write-Utf8NoBom 'language/README.md' ($readme.Trim()+$NL)

          $verify=[IO.File]::ReadAllText((Resolve-Path 'channel.json'),[Text.Encoding]::UTF8) | ConvertFrom-Json
          if([string]$verify.languagePacks[0].packVersion -ne '1.1.2'){throw 'Language version verify failed'}
          if([string]$verify.languagePacks[0].payloadSha256 -ne $env:LANGUAGE_SHA){throw 'Language hash verify failed'}
          Write-Host 'LANGUAGE_1_1_2_PUBLIC_STAGE_PASS'

      - name: Commit exact Language 1.1.2 Public update
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'NAJXBox Release Bot'
          git config user.email 'najxbox-release-bot@users.noreply.github.com'
          git add -A -- channel.json CURRENT_RELEASE_INDEX.md language .github/workflows/publish-current-locked-modules.yml
          git status --short
          if($LASTEXITCODE -ne 0){throw 'git status failed'}
          git commit -m 'release: publish Language 1.1.2 exact'
          if($LASTEXITCODE -ne 0){throw 'git commit failed'}
          git -c http.version=HTTP/1.1 push origin HEAD:main
          if($LASTEXITCODE -ne 0){throw 'git push failed'}
          Write-Host "LANGUAGE_1_1_2_PUBLIC_PUBLISH_PASS HEAD=$((git rev-parse HEAD).Trim())"

# one-time exact publication source: Drive FINAL 1XMphhS629sCCvS_BLjJYwwr6EW7rRfkm
