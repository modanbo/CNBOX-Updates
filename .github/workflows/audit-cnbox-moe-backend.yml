name: Audit CNBOX MoE backend persistence

on:
  push:
    branches:
      - work/moe-component-1.0.1
    paths:
      - '.github/workflows/audit-cnbox-moe-backend.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/moe-component-1.0.1

      - name: Fetch pinned ProTanki package
        shell: bash
        run: |
          set -euxo pipefail
          root="$RUNNER_TEMP/moe-audit"
          mkdir -p "$root"
          curl -fL --retry 3 --connect-timeout 20 \
            'https://repo.aslain.com/wot_modmanager/Files/MarksOnGun/MarksOnGun_Gun_Marks_Calculator_a834e732.zip' \
            -o "$root/protanki.zip"
          echo '3df826d272877fca504b48d968b68e4e82e7118ba7da17c27ae61c5fc24201ee  '"$root"'/protanki.zip' | sha256sum -c -
          unzip -q "$root/protanki.zip" -d "$root/upstream"
          unzip -q "$root/upstream/mods/2.4.0.1/tv.protanki.gunmarkscalc_8.1.01.wotmod" -d "$root/core"
          test -f "$root/core/res/scripts/client/gui/mods/mod_pro_gunmarks.pyc"

      - name: Export original ProTanki Flash presentation for structural diff
        shell: bash
        run: |
          set -euxo pipefail
          root="$RUNNER_TEMP/moe-audit"
          curl -fL --retry 3 --connect-timeout 20 \
            'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.3.0/ffdec_26.3.0.zip' \
            -o "$root/ffdec.zip"
          echo '35f4930eb7c380afe66f2117f90b006deac0631473ad7500bb39c78f68645ecd  '"$root"'/ffdec.zip' | sha256sum -c -
          mkdir -p "$root/ffdec" "$root/original_flash"
          unzip -q "$root/ffdec.zip" -d "$root/ffdec"
          chmod +x "$root/ffdec/ffdec.sh"
          "$root/ffdec/ffdec.sh" -export script "$root/original_flash" \
            "$root/core/res/gui/flash/protanki_gunmarks_battle.swf"

          echo '=== ORIGINAL_PROGUNMARKS_STRUCTURE ==='
          f="$root/original_flash/scripts/poliroid/views/battle/gunmarks/ProGunMarks.as"
          test -f "$f"
          grep -nE 'panel_|dragArea|as_setSettings|offsetBattle|updatePosition|startDrag|stopDrag|handleMouse|updateFrame|anchorPoint' "$f" | head -n 300
          echo '=== ORIGINAL_PROGUNMARKS_DRAG_BODY ==='
          sed -n '145,238p' "$f"

          echo '=== ORIGINAL_SIMPLE_PANEL_FIELDS ==='
          f2="$root/original_flash/scripts/poliroid/views/battle/gunmarks/GunMarksPanelNewSimple.as"
          test -f "$f2"
          grep -nE 'predictedRating|deltaRating|currentMovingDamage|battleMovingDamage|deltaDamage|panelWidth|panelHeight|setData|setSettings' "$f2" | head -n 300

      - name: Inspect compiled backend without executing it
        shell: bash
        run: |
          set -euxo pipefail
          root="$RUNNER_TEMP/moe-audit"
          pyc="$root/core/res/scripts/client/gui/mods/mod_pro_gunmarks.pyc"
          sha256sum "$pyc"
          file "$pyc" || true
          xxd -l 32 "$pyc"

          echo '=== ASCII symbols relevant to persistence/config ==='
          strings -a -n 4 "$pyc" | grep -Ei 'gun.?marks|offset|position|config|settings|update|save|anchor' | head -n 300 || true

      - name: Try Python bytecode decompile
        shell: bash
        run: |
          set -euxo pipefail
          root="$RUNNER_TEMP/moe-audit"
          pyc="$root/core/res/scripts/client/gui/mods/mod_pro_gunmarks.pyc"
          python3 -m pip install -q 'uncompyle6>=3.9,<4'
          mkdir -p "$root/decompiled"
          set +e
          uncompyle6 -o "$root/decompiled" "$pyc"
          rc=$?
          set -e
          echo "UNCOMPYLE6_RC=$rc"
          find "$root/decompiled" -type f -maxdepth 5 -print
          if find "$root/decompiled" -type f | grep -q .; then
            echo '=== Decompiled persistence/config references ==='
            grep -RniE 'offsetBattle|updatePosition|gunMarksCalculator|anchorPoint|save|config|setting' \
              "$root/decompiled" | head -n 400 || true
          fi

          echo '=== xdis opcode/name audit ==='
          set +e
          pydisasm "$pyc" > "$root/disassembly.txt" 2>&1
          drc=$?
          set -e
          echo "PYDISASM_RC=$drc"
          grep -niE 'offsetBattle|updatePosition|gunMarksCalculator|anchorPoint|save|config|setting|offset|position' \
            "$root/disassembly.txt" | head -n 500 || true
