name: Audit CNBOX MoE static structure

on:
  push:
    branches:
      - work/moe-component-1.0.4
    paths:
      - ".github/workflows/audit-cnbox-moe-backend.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/moe-component-1.0.4

      - name: Fetch pinned ProTanki core
        shell: bash
        run: |
          set -euxo pipefail
          root="$RUNNER_TEMP/moe-audit"
          mkdir -p "$root"
          curl -fL --retry 3 --connect-timeout 20 \
            "https://repo.aslain.com/wot_modmanager/Files/MarksOnGun/MarksOnGun_Gun_Marks_Calculator_a834e732.zip" \
            -o "$root/protanki.zip"
          echo "3df826d272877fca504b48d968b68e4e82e7118ba7da17c27ae61c5fc24201ee  $root/protanki.zip" | sha256sum -c -
          unzip -q "$root/protanki.zip" -d "$root/upstream"
          core="$root/upstream/mods/2.4.0.1/tv.protanki.gunmarkscalc_8.1.01.wotmod"
          test -f "$core"
          unzip -q "$core" -d "$root/core"
          test -f "$root/core/res/scripts/client/gui/mods/mod_pro_gunmarks.pyc"
          test -f "$root/core/res/gui/flash/protanki_gunmarks_battle.swf"
          sha256sum "$root/core/res/scripts/client/gui/mods/mod_pro_gunmarks.pyc"
          file "$root/core/res/scripts/client/gui/mods/mod_pro_gunmarks.pyc" || true

      - name: Export original Flash and verify drag/data contract
        shell: bash
        run: |
          set -euxo pipefail
          root="$RUNNER_TEMP/moe-audit"
          curl -fL --retry 3 --connect-timeout 20 \
            "https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.3.0/ffdec_26.3.0.zip" \
            -o "$root/ffdec.zip"
          echo "35f4930eb7c380afe66f2117f90b006deac0631473ad7500bb39c78f68645ecd  $root/ffdec.zip" | sha256sum -c -
          mkdir -p "$root/ffdec" "$root/original_flash"
          unzip -q "$root/ffdec.zip" -d "$root/ffdec"
          chmod +x "$root/ffdec/ffdec.sh"
          "$root/ffdec/ffdec.sh" -export script "$root/original_flash" \
            "$root/core/res/gui/flash/protanki_gunmarks_battle.swf"

          host="$root/original_flash/scripts/poliroid/views/battle/gunmarks/ProGunMarks.as"
          simple="$root/original_flash/scripts/poliroid/views/battle/gunmarks/GunMarksPanelNewSimple.as"
          detail="$root/original_flash/scripts/poliroid/views/battle/gunmarks/GunMarksPanelNew.as"
          test -f "$host"
          test -f "$simple"
          test -f "$detail"

          grep -Fq "this._offset = param1.offsetBattle;" "$host"
          grep -Fq "this.anchorPointType = param1.anchorPoint;" "$host"
          grep -Fq "this.dragArea.startDrag();" "$host"
          grep -Fq "this.dragArea.stopDrag();" "$host"
          grep -Fq "this.updatePosition(this._offset);" "$host"

          grep -Fq "param1.predictedRating" "$simple"
          grep -Fq "param1.deltaRating" "$simple"
          grep -Fq "param1.battleMovingDamage" "$simple"
          grep -Fq "param1.deltaDamage" "$simple"

          grep -Fq "param1.predictedMovingDamage" "$detail"
          grep -Fq "param1.currentMovingDamage" "$detail"

          echo "STATIC_ORIGINAL_DRAG_CONTRACT_OK"
          echo "STATIC_ORIGINAL_DATA_FIELDS_OK"

      - name: Optional current official archive config check
        shell: bash
        run: |
          set -euxo pipefail
          root="$RUNNER_TEMP/moe-audit"
          page="$root/protanki-download.html"
          # ProTanki returns 403 to some CI/cloud IP ranges. This probe is OPTIONAL:
          # the pinned Aslain archive above is the build input and is already SHA-locked.
          if ! curl -fL --retry 3 --connect-timeout 20 \
            "https://protanki.tv/en/mods/mod-tri-otmetki-na-stvole/download" \
            -o "$page"; then
            echo "OFFICIAL_PROTANKI_PAGE_SKIPPED_HTTP"
            exit 0
          fi

          python3 - "$page" "$root" <<'PY'
          import html, re, sys, urllib.request, zipfile, os
          page, root = sys.argv[1], sys.argv[2]
          s = html.unescape(open(page, encoding="utf-8", errors="replace").read())
          urls = re.findall(r"https://s3\.protanki\.tv/[^\"'<> ]+", s)
          if not urls:
              print("OFFICIAL_PROTANKI_DIRECT_URL_NOT_EMBEDDED")
              raise SystemExit(0)
          print("OFFICIAL_PROTANKI_DIRECT_URL_FOUND")
          archive = os.path.join(root, "protanki-official.zip")
          try:
              urllib.request.urlretrieve(urls[0], archive)
          except Exception as e:
              print("OFFICIAL_PROTANKI_DOWNLOAD_SKIPPED", repr(e))
              raise SystemExit(0)
          try:
              with zipfile.ZipFile(archive) as z:
                  names = z.namelist()
                  hits = [n for n in names if "gunmark" in n.lower() or ("protanki/" in n.lower() and n.lower().endswith(".json"))]
                  print("OFFICIAL_PROTANKI_RELEVANT_PATHS", hits[:200])
                  cfg = next((n for n in names if n.replace("\\","/").lower().endswith("mods/configs/protanki/gunmarkscalculator.json")), None)
                  if cfg:
                      print("OFFICIAL_PROTANKI_GUNMARKS_CONFIG")
                      print(z.read(cfg).decode("utf-8-sig", "replace"))
          except Exception as e:
              print("OFFICIAL_PROTANKI_ARCHIVE_INSPECT_SKIPPED", repr(e))
          PY
