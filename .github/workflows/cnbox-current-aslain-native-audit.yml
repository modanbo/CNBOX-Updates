name: CNBOX Current Aslain Native Audit Evidence
permissions:
  contents: read
on:
  push:
    paths:
      - ".github/workflows/cnbox-current-aslain-native-audit.yml"
  workflow_dispatch:
jobs:
  clean:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Resolve current native catalog and verified upstream installer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path work,out,tool,evidence | Out-Null
          $latest=(Get-Content 'aslain_catalogs/index.json' -Raw | ConvertFrom-Json).catalogs[0]
          $game=$latest.wotVersion
          $build=[int]([regex]::Match($latest.aslainVersion,'#\s*(\d+)').Groups[1].Value)
          $name=('Aslains_WoT_Modpack_Installer_v.{0}_{1:D2}.exe' -f $game,$build)
          $url='https://filez.aslain.com/'+$name
          $expectedPath=('aslain_catalogs\{0}\{1:D2}\official_installer_sha256.txt' -f $game,$build)
          $configPath=('aslain_catalogs\{0}\{1:D2}\Configuration' -f $game,$build)
          if(!(Test-Path $expectedPath) -or !(Test-Path $configPath)){ throw 'Missing catalog / SHA pin' }
          $expected=(Get-Content $expectedPath -Raw).Trim().Split(' ')[0].ToLowerInvariant()
          $exe='work\'+$name
          Invoke-WebRequest -Uri $url -OutFile $exe
          $sha=(Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          if($sha -ne $expected){ throw ('OFFICIAL_SHA_FAIL expected='+$expected+' got='+$sha) }
          ('Version='+$latest.aslainVersion+'; Bytes='+(Get-Item $exe).Length+'; SHA256='+$sha) | Set-Content -Encoding utf8 evidence\INSTALLER_SHA256_SIZE.txt
          Copy-Item -LiteralPath $configPath -Destination 'evidence/Configuration' -Force
          Copy-Item -LiteralPath $expectedPath -Destination 'evidence/official_installer_sha256.txt' -Force
          $exe | Set-Content -Encoding utf8 work\installer_path.txt
      - name: Obtain known working pinned innounp
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $pinned='6fb49264aacf512a093e7b4fc6fb3dd266dad31a'
          Invoke-WebRequest -Uri ('https://raw.githubusercontent.com/jrathlev/InnoUnpacker-Windows-GUI/'+$pinned+'/innounp-2/bin/innounp-2.zip') -OutFile 'tool/innounp-2.zip'
          ('COMMIT='+$pinned+'; ZIP_SHA256='+(Get-FileHash -Algorithm SHA256 -LiteralPath 'tool/innounp-2.zip').Hash.ToLowerInvariant()) | Set-Content -Encoding utf8 evidence\EXTRACTOR_PROVENANCE.txt
          Expand-Archive tool\innounp-2.zip -DestinationPath tool\innounp -Force
          $iu=Get-ChildItem tool\innounp -Recurse -Filter innounp.exe | Select-Object -First 1
          if(-not $iu){ throw 'Missing pinned innounp executable' }
          $iu.FullName | Set-Content -Encoding ascii tool\innounp_path.txt
      - name: Extract and hash complete native installer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $iu=(Get-Content tool\innounp_path.txt -Raw).Trim()
          $exe=(Get-Content work\installer_path.txt -Raw).Trim()
          & $iu -h -o -b -y -q -a -m -x '-dout' $exe 2>&1 | Out-File -Encoding utf8 evidence\INNOUNP_EXTRACT_LOG.txt
          if($LASTEXITCODE -ne 0){ throw ('innounp extraction failed: '+$LASTEXITCODE) }
          $root=(Resolve-Path out).Path
          $all=@(Get-ChildItem out -File -Recurse)
          if($all.Count -lt 1000){ throw ('Extracted count too low: '+$all.Count) }
          $rows=@(foreach($f in $all){
            $rel=$f.FullName.Substring($root.Length+1).Replace('\','/')
            $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath $f.FullName -ErrorAction Stop).Hash.ToLowerInvariant()
            ($rel+[char]9+$f.Length+[char]9+$hash)
          })
          $rows | Sort-Object | Set-Content -Encoding utf8 evidence\CLEAN_FULL_SHA256_MANIFEST.tsv
          ('ExtractedCount='+$all.Count) | Set-Content -Encoding ascii evidence\CLEAN_INTAKE_SUMMARY.txt
          $rows | Where-Object {$_ -match '(?i)install_script\.iss|xvm_13\.1|openwg\.common|battlevehiclemarkers|modmenu|modssettingsbridge|gameface|hangman|playerspanel|classic'} | Set-Content -Encoding utf8 evidence\CLEAN_SHARED_OWNER_PATHS.tsv
          $iss=@(Get-ChildItem out -Recurse -File -Filter 'install_script.iss')
          if($iss.Count -gt 0){ Copy-Item -LiteralPath $iss[0].FullName -Destination evidence\install_script.iss }
          else { throw 'No install_script.iss found' }
      - name: Independent previous-native shared-owner binary comparison
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $oldExe='work\Aslains_WoT_Modpack_Installer_v.2.4.1.0_05.exe'
          Invoke-WebRequest -Uri 'https://filez.aslain.com/Aslains_WoT_Modpack_Installer_v.2.4.1.0_05.exe' -OutFile $oldExe
          $oldHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $oldExe).Hash.ToLowerInvariant()
          if($oldHash -ne '165d219d98f40c6f5f78307045f1cbde51417ccabb7c142049270dc91e7cf9e4') { throw 'Native previous #05 official SHA mismatch' }
          New-Item -ItemType Directory -Force -Path previous_out | Out-Null
          $iu=(Get-Content tool\innounp_path.txt -Raw).Trim()
          & $iu -h -o -b -y -q -a -m -x '-dprevious_out' $oldExe 2>&1 | Out-File -Encoding utf8 evidence\INNOUNP_05_EXTRACT_LOG.txt
          if($LASTEXITCODE -ne 0){ throw ('Previous #05 extraction failed: '+$LASTEXITCODE) }
          @'
          import hashlib,json,zipfile,pathlib,re
          h=lambda d:hashlib.sha256(d).hexdigest()
          def collect(root,pattern):
            files=sorted((p for p in pathlib.Path(root).rglob('*') if p.is_file() and re.search(pattern,p.name,re.I)),key=str)
            rec={}
            for p in files:
              sh=h(p.read_bytes())
              rec.setdefault(sh,[]).append(str(p.relative_to(root)).replace('\\','/'))
            return files,rec
          old,om=collect('previous_out',r'^aslain\.modmenu_2\.1\.04(?:,\d+)?\.wotmod        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CNBOX-current-native-extraction
          path: evidence
          if-no-files-found: error
          retention-days: 5
)
          new,nm=collect('out',r'^aslain\.modmenu_2\.1\.05(?:,\d+)?\.wotmod        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CNBOX-current-native-extraction
          path: evidence
          if-no-files-found: error
          retention-days: 5
)
          assert old and new,(len(old),len(new))
          def inner(p):
            with zipfile.ZipFile(p) as z:return {x.filename:h(z.read(x)) for x in z.infolist() if not x.is_dir()}
          def perhash(paths):
            return {h(p.read_bytes()):inner(p) for p in paths if zipfile.is_zipfile(p)}
          a,b=perhash(old),perhash(new)
          oldinner=next(iter(a.values())) if len(a)==1 else {}
          newinner=next(iter(b.values())) if len(b)==1 else {}
          allpaths=sorted(set(oldinner)|set(newinner))
          newkeys=[k for k in allpaths if k not in oldinner]
          gone=[k for k in allpaths if k not in newinner]
          changed=[k for k in allpaths if k in oldinner and k in newinner and oldinner[k]!=newinner[k]]
          owners={}
          for pattern in [r'^com\.modxvm\.xvm_13\.1\.0\.0098\.wotmod        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CNBOX-current-native-extraction
          path: evidence
          if-no-files-found: error
          retention-days: 5
,r'^net\.openwg\.common_2\.8\.4\.0000(?:,\d+)?\.wotmod        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CNBOX-current-native-extraction
          path: evidence
          if-no-files-found: error
          retention-days: 5
,r'^battleVehicleMarkersApp\.swf        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CNBOX-current-native-extraction
          path: evidence
          if-no-files-found: error
          retention-days: 5
]:
            _,oo=collect('previous_out',pattern)
            _,nn=collect('out',pattern)
            owners[pattern]={'old':oo,'new':nn,'byteIdentical':sorted(oo)==sorted(nn),'foundBoth':bool(oo and nn)}
          result={'oldModMenu':om,'newModMenu':nm,'distinctOldHashCount':len(om),'distinctNewHashCount':len(nm),'innerOldEntries':len(oldinner),'innerNewEntries':len(newinner),'innerAdded':newkeys,'innerRemoved':gone,'innerModified':changed,'nativeCriticalOwner':owners}
          pathlib.Path('evidence/MODMENU_SHARED_OWNER_INDEPENDENT_DEEP_AUDIT.json').write_text(json.dumps(result,indent=2)+'\n')
          assert len(a)==len(b)==1,'ModMenu unresolved multi-version variants'
          assert all(v['byteIdentical'] and v['foundBoth'] for v in owners.values()),'critical XVM/OpenWG/marker owner changed'
          print('SELECTED_SHARED_OWNER_AUDIT_PASS ModMenu binary delta, XVM/OpenWG/marker exact identity',len(changed),'inner changed')
          '@ | Set-Content -Encoding utf8 work\compare_owners.py
          python work\compare_owners.py
      - name: Preserve full native evidence for independent delta audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CNBOX-current-native-extraction
          path: evidence
          if-no-files-found: error
          retention-days: 5
