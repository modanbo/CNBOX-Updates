name: Aslain current installer decomposition
permissions:
  contents: read
on:
  push:
    paths:
      - ".github/workflows/aslain-current-installer-decomposition.yml"
  workflow_dispatch:
jobs:
  decompose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install innoextract
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y innoextract
          innoextract --version
      - name: Resolve current installer
        run: |
          python3 -c 'import json,re,pathlib; idx=json.loads(pathlib.Path("aslain_catalogs/index.json").read_text(encoding="utf-8")); cur=idx["catalogs"][0]; m=re.search(r"#\\s*(\\d+)",cur["aslainVersion"]); assert m; game=cur["wotVersion"]; b=int(m.group(1)); n=f"Aslains_WoT_Modpack_Installer_v.{game}_{b:02d}.exe"; u=f"https://filez.aslain.com/{n}"; pathlib.Path("resolved.env").write_text(f"ASLAIN_VERSION={cur[chr(34)+chr(97)+chr(115)+chr(108)+chr(97)+chr(105)+chr(110)+chr(86)+chr(101)+chr(114)+chr(115)+chr(105)+chr(111)+chr(110)+chr(34)] if False else cur[chr(97)+chr(115)+chr(108)+chr(97)+chr(105)+chr(110)+chr(86)+chr(101)+chr(114)+chr(115)+chr(105)+chr(111)+chr(110)]}\\nWOT_VERSION={game}\\nBUILD={b:02d}\\nINSTALLER={n}\\nURL={u}\\n",encoding="utf-8")'
          cat resolved.env
      - name: Download and attempt extraction
        shell: bash
        run: |
          set -euo pipefail
          source resolved.env
          curl -L --fail --retry 4 --retry-delay 2 -o "$INSTALLER" "$URL"
          mkdir -p evidence extracted
          sha256sum "$INSTALLER" | tee evidence/installer.sha256
          stat -c '%n %s' "$INSTALLER" | tee evidence/installer.size
          cp resolved.env evidence/
          set +e
          innoextract -e -d extracted "$INSTALLER" > evidence/innoextract.log 2>&1
          rc=$?
          set -e
          echo "$rc" > evidence/innoextract.exitcode
          if [ "$rc" -eq 0 ]; then
            find extracted -type f -printf '%P\t%s\n' | LC_ALL=C sort > evidence/file-list.tsv
            find extracted -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > evidence/full-sha256.txt
            printf '{"extractor":"innoextract 1.9","status":"PASS"}\n' > evidence/summary.json
          else
            printf '{"extractor":"innoextract 1.9","status":"TOOL_UNSUPPORTED_NON_BLOCKING","reason":"CURRENT INSTALLER LOADER NOT SUPPORTED BY AVAILABLE INNOEXTRACT","fallback":"USE OFFICIAL NATIVE CONFIGURATION + DIRECT PACKAGE_WOTMOD AUDITS"}\n' > evidence/summary.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aslain-current-installer-decomposition
          path: evidence
          if-no-files-found: error
          retention-days: 2
