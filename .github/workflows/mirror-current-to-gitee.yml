name: mirror-current-to-gitee

on:
  push:
    branches: [main]
    paths:
      - 'moe/current/**'
      - 'moe/HISTORY.md'
      - '.github/workflows/mirror-current-to-gitee.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select configured Gitee credential
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
          GITEE_PASSWORD: ${{ secrets.GITEE_PASSWORD }}
        run: |
          set -euo pipefail
          token=""
          if [ -n "${GITEE_TOKEN:-}" ]; then
            token="$GITEE_TOKEN"
            echo "credential=GITEE_TOKEN"
          elif [ -n "${GITEE_ACCESS_TOKEN:-}" ]; then
            token="$GITEE_ACCESS_TOKEN"
            echo "credential=GITEE_ACCESS_TOKEN"
          elif [ -n "${GITEE_PASSWORD:-}" ]; then
            token="$GITEE_PASSWORD"
            echo "credential=GITEE_PASSWORD"
          else
            echo "No configured Gitee credential secret found."
            exit 2
          fi
          echo "::add-mask::$token"
          printf '%s' "$token" > "$RUNNER_TEMP/gitee_token"

      - name: Push main to Gitee mirror
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat "$RUNNER_TEMP/gitee_token")"
          git remote remove gitee 2>/dev/null || true
          git remote add gitee "https://modanbo:${token}@gitee.com/modanbo/cnbox-updates-cn.git"
          git push gitee HEAD:main
