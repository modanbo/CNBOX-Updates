name: Probe MoE 1.2.0 threshold hydration

on:
  push:
    branches:
      - work/moe-component-1.2.0-full-rebuild
    paths:
      - '.github/workflows/probe-moe-120-threshold-hydration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/moe-component-1.2.0-full-rebuild
          fetch-depth: 1

      - name: Inspect SSR hydration
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --connect-timeout 20 -A 'Mozilla/5.0' \
            'https://tomato.gg/moe/NA' -o "$RUNNER_TEMP/moe-na.html"
          python3 - "$RUNNER_TEMP/moe-na.html" <<'PY'
          import html,re,sys
          src=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          needles=[
              'initialChangeData','loaderData','hydration','__staticRouterHydrationData',
              'usa-A194_AHT_7','A194_AHT_7','"65":4625','\"65\":4625',
              'Page 1 of 16','Search 778 tanks'
          ]
          out=['bytes=%d'%len(src)]
          for n in needles:
              out.append('%s count=%d'%(n,src.count(n)))
              i=src.find(n)
              if i>=0:
                  out.append('SNIP '+n)
                  out.append(html.unescape(src[max(0,i-1500):i+5000]))
          out.append('')
          out.append('inline script candidates containing tank/loader data:')
          for m in re.finditer(r'<script\b([^>]*)>(.*?)</script>',src,re.I|re.S):
              attrs=m.group(1); body=m.group(2)
              if any(x in body for x in ('A194_AHT_7','initialChangeData','loaderData','4625')):
                  out.append('ATTRS '+attrs[:500])
                  out.append(body[:12000])
          open('moe/rebuild/1.2.0/THRESHOLD_HYDRATION_PROBE.txt','w',encoding='utf-8').write('\n'.join(out))
          print('\n'.join(out[:40]))
          PY

      - name: Commit probe
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add moe/rebuild/1.2.0/THRESHOLD_HYDRATION_PROBE.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Probe MoE 1.2.0 threshold SSR hydration'
          git push origin HEAD:work/moe-component-1.2.0-full-rebuild
