name: TEMP Creator 2.1.5 label fix
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/creator-215-label-fix-temp.yml'
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply Creator-only locked bytes
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail 'https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-6278-820c-9537-8e45a7c7408d/raw?se=2026-10-03T18%3A26%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=41039d09-5bef-5d0c-bb20-fd6a7bde3206&skoid=c953efd6-2ae8-41b4-a6d6-34b1475ac07c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T12%3A05%3A57Z&ske=2026-10-04T12%3A05%3A57Z&sks=b&skv=2026-02-06&sig=OYlJSOE23%2BnXyRWzvXYfeEtrELW3wo7uwwQxRebiHPA%3D' -o /tmp/bundle.zip
          test "$(sha256sum /tmp/bundle.zip | awk '{print $1}')" = "081c46e4ba9f5286dc4d3445431a183986538984acbb6e7c7641094297914a4c"
          rm -rf /tmp/mgr215 && mkdir -p /tmp/mgr215
          unzip -q /tmp/bundle.zip -d /tmp/mgr215
          creator=/tmp/mgr215/Creator/NAJXBox_Manager_Candidate_Creator.exe
          test "$(sha256sum "$creator" | awk '{print $1}')" = "682a1804d76bf8d0fb9d22b26934d780889c86135acdef49649c96d703e368f8"
          test "$(sha256sum manager/NAJXBox_Manager.exe | awk '{print $1}')" = "47706d47671df61787a4fc8b5088e178b1fcc0c595590635a77f183d1bc469d5"
          cp "$creator" manager/NAJXBox_Manager_Creator.exe
          cp "$creator" manager/CNBOX_Manager_Creator.exe
          cp "$creator" manager/NAJXBox_Manager_Creator_v2.1.5.exe
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path("channel.json")
          j=json.loads(p.read_text(encoding="utf-8"))
          assert j["managerVersion"]=="2.1.5"
          assert j["managerSha256"]=="47706d47671df61787a4fc8b5088e178b1fcc0c595590635a77f183d1bc469d5"
          j["creatorManagerVersion"]="2.1.5"
          j["creatorManagerSha256"]="682a1804d76bf8d0fb9d22b26934d780889c86135acdef49649c96d703e368f8"
          p.write_text(json.dumps(j,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          idx=pathlib.Path("CURRENT_RELEASE_INDEX.md")
          t=idx.read_text(encoding="utf-8")
          t=t.replace("Manager Creator: 2.1.5 / caf3e20eabc1bd46ab1aeebeef3d75588d64c4beb24a3f007c2010388516f89e",
                      "Manager Creator: 2.1.5 / 682a1804d76bf8d0fb9d22b26934d780889c86135acdef49649c96d703e368f8")
          assert "682a1804d76bf8d0fb9d22b26934d780889c86135acdef49649c96d703e368f8" in t
          idx.write_text(t,encoding="utf-8")
          rd=pathlib.Path("manager/README.md")
          t=rd.read_text(encoding="utf-8")
          t=t.replace("Creator SHA256: caf3e20eabc1bd46ab1aeebeef3d75588d64c4beb24a3f007c2010388516f89e",
                      "Creator SHA256: 682a1804d76bf8d0fb9d22b26934d780889c86135acdef49649c96d703e368f8")
          t=t.replace("Exact final source: 810a1a4e8d6141e26768a7624a5324daf277da57",
                      "Public source: 810a1a4e8d6141e26768a7624a5324daf277da57\nCreator source: b0c91e6aa190c81242b53ba993adce1c0e8dc4ff")
          t += "\nCreator 2.1.5 label-only hotfix: language-test install button label updated; Public Manager bytes unchanged.\n"
          rd.write_text(t,encoding="utf-8")
          sp=pathlib.Path("manager/NAJXBox_Manager_v2.1.5_RELEASE_EXCEPTION.json")
          s=json.loads(sp.read_text(encoding="utf-8"))
          assert s["publicSha256"]=="47706d47671df61787a4fc8b5088e178b1fcc0c595590635a77f183d1bc469d5"
          s["creatorSha256"]="682a1804d76bf8d0fb9d22b26934d780889c86135acdef49649c96d703e368f8"
          s["creatorSourceHead"]="b0c91e6aa190c81242b53ba993adce1c0e8dc4ff"
          s["creatorLabelFix"]="Creator Language-test install button label only"
          sp.write_text(json.dumps(s,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          git config user.name 'NAJXBox Release Bot'
          git config user.email 'najxbox-release-bot@users.noreply.github.com'
          git add manager/CNBOX_Manager_Creator.exe manager/NAJXBox_Manager_Creator.exe manager/NAJXBox_Manager_Creator_v2.1.5.exe manager/README.md manager/NAJXBox_Manager_v2.1.5_RELEASE_EXCEPTION.json channel.json CURRENT_RELEASE_INDEX.md
          if git diff --cached --name-only | grep -Eq '^manager/(CNBOX_Manager|NAJXBox_Manager|NAJXBox_Manager_v2\.1\.5)\.exe$'; then
            echo "Public Manager binary staged unexpectedly" >&2
            exit 1
          fi
          git commit -m 'release: update Creator 2.1.5 language-test label'
          git push origin HEAD:main
