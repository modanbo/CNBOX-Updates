name: Promote MoE 1.2.9 FINAL_LOCK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-moe-1.2.9.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  promote:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download exact Runtime-passed 1.2.9 artifact
        uses: actions/download-artifact@v4
        with:
          name: moe-1.2.9-lobby-lifecycle-owner-rebuild
          path: candidate129
          repository: modanbo/CNBOX-Updates
          run-id: 36375407443
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact candidate and promote without rebuilding bytes
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'

          $candidate = "candidate129/NAJXBOX_MoE_INDEPENDENT_1.2.9_LOBBY_LIFECYCLE_OWNER_REBUILD_WOT_2.4.0.1_TEST_CANDIDATE.zip"
          if (!(Test-Path $candidate)) { throw "Exact 1.2.9 candidate missing." }

          $outerSha = (Get-FileHash $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($outerSha -ne "624276153a5b65bd74eda0009ffba23061cb0d111ccb78dd7f1328b1f100136c") {
            throw "1.2.9 candidate SHA mismatch: $outerSha"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $za = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $candidate))
          try {
            $entry = $za.Entries | Where-Object {
              $_.FullName -eq "mods/2.4.0.1/najxbox.moe_independent_1.2.4.wotmod"
            }
            if ($null -eq $entry) { throw "1.2.9 WOTMOD missing." }

            $tmpWotmod = Join-Path $env:RUNNER_TEMP "moe129.wotmod"
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry,$tmpWotmod,$true)
          } finally {
            $za.Dispose()
          }

          $innerSha = (Get-FileHash $tmpWotmod -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($innerSha -ne "fc81ac5bf0baa92339a179373835cd0246be78fb9cddde44d239270f5c8035b2") {
            throw "1.2.9 WOTMOD SHA mismatch: $innerSha"
          }

          $dir = "moe/1.2.9"
          New-Item $dir -ItemType Directory -Force | Out-Null
          $finalName = "NAJXBOX_MoE_INDEPENDENT_1.2.9_LOBBY_LIFECYCLE_OWNER_REBUILD_WOT_2.4.0.1.zip"
          Copy-Item $candidate (Join-Path $dir $finalName) -Force

          @"
          $outerSha  $finalName
          $innerSha  mods/2.4.0.1/najxbox.moe_independent_1.2.4.wotmod
          "@.Trim() + [Environment]::NewLine |
            Set-Content (Join-Path $dir "SHA256SUMS.txt") -Encoding ascii

          $manifest = [ordered]@{
            schemaVersion = 1
            id = "CNBOX_MOE"
            version = "1.2.9"
            status = "FINAL_LOCK"
            wotVersion = "2.4.0.1"
            package = $finalName
            payloadSha256 = $outerSha
            runtimeStatus = "RUNTIME_PASS / LOBBY_LIFECYCLE_OWNER_REBUILD_CLOSED"
            sourceBuildRun = 36375407443
            sourceCommit = "32e8ed6d2637a374f73f76ad4131887abd30e8f5"
            exactRuntimeCandidateSha256 = "624276153a5b65bd74eda0009ffba23061cb0d111ccb78dd7f1328b1f100136c"
            wotmod = [ordered]@{
              path = "mods/2.4.0.1/najxbox.moe_independent_1.2.4.wotmod"
              sha256 = $innerSha
              embeddedVersion = "1.2.9"
              filenameNote = "Legacy internal filename retained; exact Runtime-passed WOTMOD bytes."
            }
            runtime = [ordered]@{
              initialHangar = "PASS"
              repeatedVehicleSwitching = "PASS"
              nonHangarReturn = "PASS"
              serverSwitchRestore = "PASS"
              postServerSwitchVehicleSwitching = "PASS"
              battleCore = "NOT_REOPENED / EXACT_1.2.8_BYTES"
            }
          }
          $manifest | ConvertTo-Json -Depth 10 |
            Set-Content (Join-Path $dir "manifest.json") -Encoding UTF8

          $channel = Get-Content "channel.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          $channel.moePacks = @(
            [ordered]@{
              id = "CNBOX_MOE"
              version = "1.2.9"
              status = "FINAL_LOCK"
              wotVersion = "2.4.0.1"
              sourceCore = "NAJXBox independent; Official CN UI contract + NA data authorities"
              payloadUrl = "https://raw.githubusercontent.com/modanbo/CNBOX-Updates/main/moe/1.2.9/$finalName"
              payloadSha256 = $outerSha
              notes = "Runtime-passed 1.2.9 Lobby lifecycle owner rebuild. Initial Hangar, repeated vehicle switching, non-Hangar return, server-switch recreation/restoration and post-server-switch vehicle switching PASS. Battle/data/SWF/ui core remain exact 1.2.8 bytes; only lifecycle ownership was reopened."
              installedFiles = @(
                [ordered]@{
                  path = "mods/{WOT_VERSION}/najxbox.moe_independent_1.2.4.wotmod"
                  sha256 = $innerSha
                  required = $true
                  shared = $false
                }
              )
            }
          )

          $json = $channel | ConvertTo-Json -Depth 100
          [IO.File]::WriteAllText(
            (Resolve-Path "channel.json"),
            $json,
            (New-Object Text.UTF8Encoding($false)))

          git config user.name "najxbox-release-bot"
          git config user.email "najxbox-release-bot@users.noreply.github.com"
          git add -- channel.json "moe/1.2.9"
          git commit -m "Promote MoE 1.2.9 FINAL_LOCK from exact Runtime-passed bytes"
          git push

          Write-Host "MOE_1.2.9_FINAL_LOCK_PROMOTION_PASS"
          Write-Host "PackageSHA256=$outerSha"
          Write-Host "WOTMODSHA256=$innerSha"
