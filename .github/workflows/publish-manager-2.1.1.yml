name: Publish Manager 2.1.1

on:
  push:
    branches: [main]
    paths:
      - ".publisher/release-manager-2.1.1.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish verified Manager 2.1.1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $req = Get-Content ".publisher/release-manager-2.1.1.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($req.schemaVersion -ne 1) { throw "Unsupported request schema." }
          if ($req.active -eq $false) { Write-Host "Inactive request."; exit 0 }
          if ([string]$req.sourceManagerCommit -ne "efb0f6d5ef2ec6bb538f1c3387066b9b6bd7e8eb") { throw "Unexpected source head." }
          if ([int64]$req.sourceManagerRun -ne 36506936627) { throw "Unexpected build run." }
          if ([int64]$req.realClientGateRun -ne 36506936510) { throw "Unexpected real-client gate run." }

          $zip = Join-Path $env:RUNNER_TEMP "manager211.zip"
          $out = Join-Path $env:RUNNER_TEMP "manager211"
          Invoke-WebRequest -Uri $req.artifactUrl -OutFile $zip -UseBasicParsing

          $zipSha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipSha -ne ([string]$req.artifactSha256).ToLowerInvariant()) {
            throw "Manager artifact ZIP SHA mismatch: $zipSha"
          }

          Expand-Archive $zip $out -Force
          $pub=Join-Path $out "Public/NAJXBox_Manager.exe"
          $cre=Join-Path $out "Creator/NAJXBox_Manager_Creator.exe"
          if (!(Test-Path $pub) -or !(Test-Path $cre)) { throw "Manager artifact structure invalid." }

          $pubSha=(Get-FileHash $pub -Algorithm SHA256).Hash.ToLowerInvariant()
          $creSha=(Get-FileHash $cre -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($pubSha -ne ([string]$req.publicSha256).ToLowerInvariant()) { throw "Public SHA mismatch: $pubSha" }
          if ($creSha -ne ([string]$req.creatorSha256).ToLowerInvariant()) { throw "Creator SHA mismatch: $creSha" }

          New-Item "manager" -ItemType Directory -Force | Out-Null
          Copy-Item $pub "manager/NAJXBox_Manager.exe" -Force
          Copy-Item $pub "manager/CNBOX_Manager.exe" -Force
          Copy-Item $pub "manager/NAJXBox_Manager_v2.1.1.exe" -Force
          Copy-Item $cre "manager/NAJXBox_Manager_Creator.exe" -Force
          Copy-Item $cre "manager/CNBOX_Manager_Creator.exe" -Force
          Copy-Item $cre "manager/NAJXBox_Manager_Creator_v2.1.1.exe" -Force

          $channel=Get-Content "channel.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          $channel.managerVersion="2.1.1"
          $channel.managerUrl="https://raw.githubusercontent.com/modanbo/CNBOX-Updates/main/manager/NAJXBox_Manager.exe"
          $channel.managerSha256=$pubSha
          $channel.creatorManagerVersion="2.1.1"
          $channel.creatorManagerUrl="https://raw.githubusercontent.com/modanbo/CNBOX-Updates/main/manager/NAJXBox_Manager_Creator.exe"
          $channel.creatorManagerSha256=$creSha

          $moe=@($channel.moePacks | Where-Object { $_.id -eq "CNBOX_MOE" })
          if ($moe.Count -ne 1 -or [string]$moe[0].version -ne "1.2.9" -or [string]$moe[0].status -ne "FINAL_LOCK") {
            throw "MoE 1.2.9 FINAL_LOCK binding changed unexpectedly."
          }
          $box=@($channel.releases | Where-Object { $_.cnboxVersion -eq "2401-R34-R2F9-UNIFIED-R5" -and $_.releaseTrack -eq "PUBLIC_STANDALONE" })
          if ($box.Count -ne 1 -or [string]$box[0].payloadSha256 -ne "cf8ce97f9e33ee013c0383d2c940d5ee37985749bd8e12e299b13a8ad70829b6") {
            throw "Public Box R5 binding changed unexpectedly."
          }

          $json=$channel | ConvertTo-Json -Depth 100
          [IO.File]::WriteAllText((Resolve-Path "channel.json"),$json,(New-Object Text.UTF8Encoding($false)))

          @"
          # NAJXBox Manager - Public Files

          Current authority: ../channel.json.

          Current version: **2.1.1**

          Validated authority:
          - exact source head: efb0f6d5ef2ec6bb538f1c3387066b9b6bd7e8eb
          - self-hosted build run: 36506936627 - SUCCESS
          - BO real-client cache gate run: 36506936510 - SUCCESS
          - Public SelfTest: PASS
          - Creator SelfTest: PASS
          - startup stale published MoE cache refresh: PASS on real client
          - full Check Updates WoT/Aslain/XVM/Box/language/MoE reconciliation: PASS on real client
          - failed online refresh preserves last successful display only while stale action authority remains cleared: PASS
          - Creator integration-test and MoE-test picker directories survive refresh/restart state: PASS

          Live GitHub files:
          - CNBOX_Manager.exe - legacy stable Public compatibility alias.
          - NAJXBox_Manager.exe - canonical stable Public alias.
          - NAJXBox_Manager_v2.1.1.exe - current versioned Public binary.
          - CNBOX_Manager_Creator.exe - legacy Creator compatibility alias.
          - NAJXBox_Manager_Creator.exe - canonical Creator alias.
          - NAJXBox_Manager_Creator_v2.1.1.exe - current versioned Creator binary.

          Public Manager SHA256: $pubSha
          Creator Manager SHA256: $creSha

          Public Box binding remains **2401-R34-R2F9-UNIFIED-R5**.
          Public MoE binding remains **1.2.9 FINAL_LOCK**.

          2.1.1 cache semantics:
          - “检查更新” still performs the complete existing reconciliation pipeline, including official/latest Aslain detection.
          - starting a new explicit check immediately invalidates stale install/update/repair authority.
          - the last successful dashboard text stays visible while refresh runs and when an online refresh fails.
          - stale display history never grants install/update/repair authority.
          - a successful startup lightweight language/MoE refresh replaces and persists stale published labels.
          - Creator remembers integration-test ZIP and MoE-test ZIP folders independently.

          Distribution boundary:
          - Public self-update channel points to the Public Manager.
          - Creator remains available on GitHub/Drive for engineering use.
          - This publication does not modify Box, MoE payload, language/font payload, or unrelated Aslain plugins.
          "@ | Set-Content "manager/README.md" -Encoding UTF8

          git config user.name "najxbox-release-bot"
          git config user.email "najxbox-release-bot@users.noreply.github.com"
          git add -- channel.json manager
          git commit -m "Publish Manager 2.1.1 Public and Creator"
          git push

          Write-Host "MANAGER_2.1.1_PUBLISH_PASS"
          Write-Host "PublicSHA256=$pubSha"
          Write-Host "CreatorSHA256=$creSha"
