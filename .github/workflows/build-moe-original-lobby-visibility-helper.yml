name: build-moe-original-lobby-visibility-helper
on:
  push:
    paths:
      - '.github/workflows/build-moe-original-lobby-visibility-helper.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container: python:2.7-slim
    steps:
      - name: Compile Python 2.7 helper
        shell: sh
        run: |
          mkdir -p /tmp/moe
          cat > /tmp/moe/mod_najxbox_moe_lobby_visibility.py <<'PY'
          # -*- coding: utf-8 -*-
          """
          NAJXBox MoE lobby visibility bridge.
          Owner model follows the original CN mod_markongun lifecycle:
          LobbyStateMachine.__updateVisibleRoute decides whether the lobby panel
          belongs to the currently visible Hangar route.

          This module does not own data, calculation, SWF, Ctrl/cursor, or position.
          It only emits WoT's existing HANGAR_STATUS_CHANGED event consumed by
          NAJXBox MoE 1.2.4.
          """
          import traceback

          _TAG = '[NAJXBox.MoE.Visibility]'

          try:
              from gui.lobby_state_machine.lobby_state_machine import LobbyStateMachine
              from gui.shared import g_eventBus, EVENT_BUS_SCOPE
              from gui.shared.events import LobbySimpleEvent
          except Exception:
              print _TAG, 'import failed'
              traceback.print_exc()
              LobbyStateMachine = None

          def _to_text(value):
              try:
                  if isinstance(value, basestring):
                      return value
                  return str(value)
              except Exception:
                  return ''

          def _visible_state(machine):
              try:
                  states = machine.getNonEmptyEnteredStates()
                  if states:
                      return states[0]
              except Exception:
                  traceback.print_exc()
              return None

          def _is_hangar_state(state):
              if state is None:
                  return False
              sid = _to_text(getattr(state, 'STATE_ID', '')).lower()
              # Original CN plugin makes LobbyStateMachine visible-route the owner.
              # Standard and event-mode Hangar state ids all carry "hangar".
              return 'hangar' in sid

          def _emit_hangar_visibility(is_visible):
              try:
                  ctx = {'isVisible': bool(is_visible)}
                  try:
                      event = LobbySimpleEvent(LobbySimpleEvent.HANGAR_STATUS_CHANGED, ctx=ctx)
                  except TypeError:
                      event = LobbySimpleEvent(LobbySimpleEvent.HANGAR_STATUS_CHANGED, ctx)
                  try:
                      g_eventBus.handleEvent(event, scope=EVENT_BUS_SCOPE.LOBBY)
                  except TypeError:
                      g_eventBus.handleEvent(event, EVENT_BUS_SCOPE.LOBBY)
              except Exception:
                  print _TAG, 'event dispatch failed'
                  traceback.print_exc()

          if LobbyStateMachine is not None:
              try:
                  _ORIGINAL_UPDATE_VISIBLE_ROUTE = LobbyStateMachine._LobbyStateMachine__updateVisibleRoute

                  def _najx_update_visible_route(self):
                      result = _ORIGINAL_UPDATE_VISIBLE_ROUTE(self)
                      try:
                          state = _visible_state(self)
                          _emit_hangar_visibility(_is_hangar_state(state))
                      except Exception:
                          print _TAG, 'route update failed'
                          traceback.print_exc()
                      return result

                  LobbyStateMachine._LobbyStateMachine__updateVisibleRoute = _najx_update_visible_route
                  print _TAG, 'original-CN visible-route owner installed'
              except Exception:
                  print _TAG, 'hook install failed'
                  traceback.print_exc()
          PY
          python -m py_compile /tmp/moe/mod_najxbox_moe_lobby_visibility.py
          python - <<'PY'
          import hashlib, base64
          p='/tmp/moe/mod_najxbox_moe_lobby_visibility.pyc'
          data=open(p,'rb').read()
          print('PYC_MAGIC=' + data[:4].encode('hex'))
          print('PYC_SHA256=' + hashlib.sha256(data).hexdigest())
          print('PYC_BASE64_BEGIN')
          print(base64.b64encode(data))
          print('PYC_BASE64_END')
          PY
