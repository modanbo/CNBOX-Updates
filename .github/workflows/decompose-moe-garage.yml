name: Decompose garage MoE candidates

on:
  push:
    branches:
      - work/moe-garage-decompose
    paths:
      - ".github/workflows/decompose-moe-garage.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/moe-garage-decompose

      - name: Parse latest Aslain catalog for garage and MoE candidates
        shell: bash
        run: |
          set -euxo pipefail
          cfg="aslain_catalogs/2.4.0.1/05/Configuration"
          mkdir -p moe/garage_diagnostics

          python3 - "$cfg" > moe/garage_diagnostics/aslain05_garage_moe_candidates.txt <<'PY'
          import sys, xml.etree.ElementTree as ET
          p=sys.argv[1]
          root=ET.parse(p).getroot()

          def walk(node, category="", group=""):
              if node.tag == "Category":
                  category=node.attrib.get("Id","")
              if node.tag == "Group":
                  group=node.attrib.get("Id","")
              if node.tag == "Mod":
                  a=node.attrib
                  mid=a.get("Id","")
                  file=a.get("File","")
                  legacy=a.get("Legacy","")
                  author=a.get("AuthorUrl","")
                  probe=" ".join((mid,file,legacy,author)).lower()
                  if any(k in probe for k in ("garage","hangar","mark","moe","gunmark")):
                      print("MOD")
                      print(" category =",category)
                      print(" group    =",group)
                      print(" id       =",mid)
                      print(" file     =",file)
                      print(" legacy   =",legacy)
                      print(" author   =",author)
                      for ch in node:
                          if ch.tag=="Package":
                              print(" package  =",ch.attrib.get("File",""),"order=",ch.attrib.get("Order",""))
                      print()
              for ch in node:
                  walk(ch,category,group)
          walk(root)
          PY

          wc -c moe/garage_diagnostics/aslain05_garage_moe_candidates.txt
          head -n 2000 moe/garage_diagnostics/aslain05_garage_moe_candidates.txt

      - name: Commit diagnostic evidence
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moe/garage_diagnostics
          git commit -m "Record Aslain #05 garage MoE candidates"
          git push origin HEAD:work/moe-garage-decompose
