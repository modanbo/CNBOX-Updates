name: Build MoE 1.2.0 CPython 2.7 core

on:
  push:
    branches:
      - work/moe-component-1.2.0-full-rebuild
    paths:
      - 'moe/rebuild/1.2.0/source/**'
      - '.github/workflows/build-moe-120-python27-core.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/moe-component-1.2.0-full-rebuild
          fetch-depth: 1

      - name: Build pinned CPython 2.7.18 from source
        shell: bash
        run: |
          set -euxo pipefail
          root="$RUNNER_TEMP/cpython27"
          src="$RUNNER_TEMP/Python-2.7.18"
          archive="$RUNNER_TEMP/Python-2.7.18.tar.xz"

          curl -fL --retry 3 --connect-timeout 20             'https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tar.xz'             -o "$archive"

          echo 'b62c0e7937551d0cc02b8fd5cb0f544f9405bafc9a54d3808ed4594812edef43  '"$archive" | sha256sum -c -

          tar -xJf "$archive" -C "$RUNNER_TEMP"
          cd "$src"
          ./configure --prefix="$root" --without-ensurepip
          make -j2 python Parser/pgen
          ./python -V
          test "$(./python - <<'PY'
          import imp
          print(imp.get_magic().encode('hex'))
          PY
          )" = '03f30d0a'

      - name: Compile deterministic CPython 2.7 bytecode
        shell: bash
        run: |
          set -euxo pipefail
          py="$RUNNER_TEMP/Python-2.7.18/python"
          rm -rf moe/rebuild/1.2.0/build/python27
          mkdir -p moe/rebuild/1.2.0/build/python27/res/scripts/client/gui/mods/najxbox_moe

          find moe/rebuild/1.2.0/source -type f -name '*.py' -exec touch -d @946684800 {} +

          "$py" - <<'PY'
          import hashlib
          import os
          import py_compile

          root='moe/rebuild/1.2.0'
          src=os.path.join(root,'source')
          out=os.path.join(root,'build','python27','res','scripts','client','gui','mods')
          package=os.path.join(out,'najxbox_moe')
          mapping=[
              ('mod_najxbox_moe.py', os.path.join(out,'mod_najxbox_moe.pyc'), 'res/scripts/client/gui/mods/mod_najxbox_moe.py'),
              ('__init__.py', os.path.join(package,'__init__.pyc'), 'res/scripts/client/gui/mods/najxbox_moe/__init__.py'),
              ('config.py', os.path.join(package,'config.pyc'), 'res/scripts/client/gui/mods/najxbox_moe/config.py'),
              ('contract.py', os.path.join(package,'contract.pyc'), 'res/scripts/client/gui/mods/najxbox_moe/contract.py'),
              ('engine.py', os.path.join(package,'engine.pyc'), 'res/scripts/client/gui/mods/najxbox_moe/engine.py'),
              ('formula.py', os.path.join(package,'formula.pyc'), 'res/scripts/client/gui/mods/najxbox_moe/formula.py'),
              ('threshold_runtime.py', os.path.join(package,'threshold_runtime.pyc'), 'res/scripts/client/gui/mods/najxbox_moe/threshold_runtime.py'),
              ('view.py', os.path.join(package,'view.pyc'), 'res/scripts/client/gui/mods/najxbox_moe/view.py'),
          ]
          for name,cfile,dfile in mapping:
              py_compile.compile(os.path.join(src,name), cfile=cfile, dfile=dfile, doraise=True)

          for _,cfile,dfile in mapping:
              data=open(cfile,'rb').read()
              print('%s  %d  magic=%s  %s' % (
                  hashlib.sha256(data).hexdigest(),
                  len(data),
                  data[:4].encode('hex'),
                  dfile+'c'))
          PY

      - name: Verify CPython 2.7 runtime inventory
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import glob,hashlib,os

          files=sorted(glob.glob('moe/rebuild/1.2.0/build/python27/**/*.pyc',recursive=True))
          assert len(files)==8, files
          assert not any(p.endswith('/wgapi.pyc') for p in files), files

          report=[
              'compiler=CPython 2.7.18',
              'source_url=https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tar.xz',
              'source_sha256=b62c0e7937551d0cc02b8fd5cb0f544f9405bafc9a54d3808ed4594812edef43',
              'expected_pyc_magic=03f30d0a',
              'runtime_pyc_count=8',
              ''
          ]
          for p in files:
              data=open(p,'rb').read()
              magic=data[:4].hex()
              assert magic=='03f30d0a', (p,magic)
              rel=p.split('/build/python27/',1)[1]
              report.append('%s  %d  magic=%s  %s' % (
                  hashlib.sha256(data).hexdigest(),len(data),magic,rel))

          open('moe/rebuild/1.2.0/PYTHON27_BUILD_SHA256.txt','w').write('\n'.join(report)+'\n')
          print('\n'.join(report))
          PY

      - name: Commit CPython 2.7 build
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f moe/rebuild/1.2.0/build/python27 moe/rebuild/1.2.0/PYTHON27_BUILD_SHA256.txt
          if git diff --cached --quiet; then
            echo 'No CPython 2.7 build delta.'
            exit 0
          fi
          git commit -m 'MoE 1.2.0: build runtime core with CPython 2.7.18'
          git push origin HEAD:work/moe-component-1.2.0-full-rebuild
