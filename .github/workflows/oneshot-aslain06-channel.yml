name: One-shot Aslain #06 Creator channel rebase
on:
  push:
    paths:
      - '.github/workflows/oneshot-aslain06-channel.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Update channel metadata
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:GITHUB_WORKSPACE 'channel.json'
          $j = Get-Content -Raw -LiteralPath $path | ConvertFrom-Json
          if ($j.managerVersion -ne '2.0.3') { throw "Public Manager authority mismatch: $($j.managerVersion)" }
          if ($j.latestAslainVersion -ne '2.4.0.1 #06') { throw "Expected latestAslainVersion #06, got $($j.latestAslainVersion)" }
          if ($j.creatorTestPackage.status -ne 'TEST_CANDIDATE') { throw "Creator test package must remain TEST_CANDIDATE" }
          if ($j.creatorTestPackage.sha256 -ne '65852ab8876c415a96e02f4b46b5680fd3350f7592f290ed9adcb7b488cdcf0c') { throw "Unexpected R4 payload hash" }

          $j.creatorManagerVersion = '2.0.3'
          $j.creatorManagerSha256 = 'd577ff95e0dc0104728ad3a73e98f3c0370b7196e1a56fd8b65d3ee2585f988b'
          $j.creatorTestPackage.version = '2401-06-R34-R2F9-TEST-CANDIDATE-R4'
          $j.creatorTestPackage.wotVersion = '2.4.0.1'
          $j.creatorTestPackage.aslainVersion = '2.4.0.1 #06'
          $j.creatorTestPackage.xvmVersion = '13.1.0.0090'
          $j.creatorTestPackage.fileName = 'CNBOX_ASLAIN06_TEST_CANDIDATE_R4_FINAL_RUNTIME_HANDOFF.zip'
          $j.creatorTestPackage.sha256 = '65852ab8876c415a96e02f4b46b5680fd3350f7592f290ed9adcb7b488cdcf0c'
          $j.creatorTestPackage.notes = 'Creator-only Aslain #06 low-risk rebase of the byte-identical R4 test candidate. #05->#06 changes do not touch the CNBOX XVM/OpenWG/PlayersPanel owner boundary. Public release selection must ignore this TEST_CANDIDATE. RUNTIME_NOT_REQUIRED_FOR_THIS_UPSTREAM_DELTA; R4 visual delta still requires one normal real-game test before FINAL_LOCK promotion.'
          $json = $j | ConvertTo-Json -Depth 100
          Set-Content -LiteralPath $path -Value $json -Encoding UTF8
          $check = Get-Content -Raw -LiteralPath $path | ConvertFrom-Json
          if ($check.creatorTestPackage.aslainVersion -ne '2.4.0.1 #06') { throw 'Channel round-trip validation failed' }
          if ($check.creatorTestPackage.status -ne 'TEST_CANDIDATE') { throw 'Track separation regression' }
          if (($check.releases | Where-Object { $_.status -eq 'FINAL_LOCK' -and $_.releaseTrack -eq 'CREATOR_ASLAIN' -and $_.aslainVersion -eq '2.4.0.1 #04' }).Count -lt 1) { throw 'Formal #04 Creator FINAL_LOCK missing' }
          Write-Host "Creator candidate: $($check.creatorTestPackage.version) / $($check.creatorTestPackage.aslainVersion)"
          Write-Host "Creator Manager: $($check.creatorManagerVersion) $($check.creatorManagerSha256)"
      - name: Commit channel rebase
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add channel.json
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Rebase Creator test candidate to Aslain #06'
            git push origin HEAD:main
          } else {
            Write-Host 'No channel change required.'
          }
