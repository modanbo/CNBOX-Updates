name: Prune 10 verified merged historical refs (retain all tools and formal releases)
on:
  push:
    paths:
      - .github/workflows/prune-public-merged-history-refs-20261023.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prune-exact-merged-history-only:
    if: github.repository == 'modanbo/CNBOX-Updates' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout live tools and current formal release unchanged
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail-closed SHA/ref/backup/manufacturing-tools precheck
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          backup_source = '3830d71d5104c61ece319a158b16cd1f4f508f97'
          backup_sha256 = 'afc9afd167c3697bd38731ab92776d409074577beb7b983748632f7396461968'
          # Backup in existing Google Drive WOT/GITHUB_HISTORY_BACKUPS/02_CNBOX-Updates_PUBLIC/01_GIT_BUNDLE_ALL_REFS:
          # Drive 3-part files: 1f-_d1zJVL_UUAHRupTPYOM44PbxV0ypI;1QcOxq_wf8OL9a6P3Kh8uWOlWIba95vBn;1nwhFrjXPeWZAPhuyZMoXKMLgpxwlp0G8.
          # Independent full SHA, all 30 original branch commits restorable and all protected tools original bytes verified.
          refs = {
            "engineering/aslain2410-06-owner18-native-20261021": "8dbbc62b61929bbe4af87f3eef6b06872a146218",
            "engineering/cnbox-aslain-20261021-owner-intake": "8dbbc62b61929bbe4af87f3eef6b06872a146218",
            "work/moe-component-1.0.10-trilocale": "0bdded3ad9898ae9dc9f430cc34a9957270a612a",
            "work/moe-component-1.0.11-runtime-recovery": "a788249c7591a10607247dccd0e49b521ef25dd0",
            "work/moe-component-1.0.9-cn-official-ui": "0fca1a9c7d1c36257f24c0bd0b237bfc69561be7",
            "work/moe-component-1.0.9-ui-detail": "1532e1014c5f436ac3b8b78e5eeb35a09a567cea",
            "work/moe-component-1.1.0-official-ui-recovery": "ca64cc9bf9d7bf0dda8cdbc2a3c7c7fc9dfa1c1c",
            "work/moe-component-1.1.1-drag-hitarea": "591579a556f915de057dbf0f46da5b202cc5fd44",
            "work/moe-component-1.1.2-battle-owner": "1f48589cd65184b5f4e50ff6982b2e5417eaad44",
            "work/moe-component-1.1.3-cn-host-na-data-bridge": "9a6f0f6638960ba48c2b12939d2391be2bbb9a0b"
          }
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          live_head = git('rev-parse','HEAD')
          if live_head != os.environ.get('GITHUB_SHA'):
              raise SystemExit('FAIL_CLOSED checkout not current event SHA')
          subprocess.run(['git','merge-base','--is-ancestor',backup_source,live_head],check=True)
          git_paths = {
            'channel.json':'51766850730fbf054ae09b1c0ffc899db859a6d2',
            'payloads/2.4.1.0/unified/CNBOX_PAYLOAD_1.2.1.zip':'d8895dee71eb7a357107751cd5b8bc95b2426405',
            'language/NAJXBOX_LANGUAGE_1.1.3_WOT_2.4.1.0_FINAL_LOCK_20261014.zip':'1d2be3e0f78c9ffcc52e8657404a7860177d36ef',
            'manager/NAJXBox_Manager.exe':'c8e8cd108fd7d581423b346c17ebd3bff9135f31',
            'manager/NAJXBox_Manager_Creator.exe':'2a940edb511e9ff34282be20d46d4183469b682c',
            'moe/1.3.1/NAJXBOX_MoE_1.3.1_WOT_2.4.1.0_FINAL_LOCK.zip':'759aaa698ebae7652f9ba0dbc20dfc4dc60151f0',
            '.github/release-tools/publish_locked_modules.py':'9e63750843ab6dd8eb3d300cd68f7e18eb36ffd2'
          }
          for path,sha in git_paths.items():
              if git('rev-parse','HEAD:'+path) != sha:
                  raise SystemExit('FAIL_CLOSED CURRENT/TOOL bytes changed: '+path)
          raw = git('ls-remote','--heads','origin')
          current = {line.split()[1][len('refs/heads/'):]:line.split()[0] for line in raw.splitlines()}
          if not current.get('main') == live_head:
              raise SystemExit('FAIL_CLOSED main moved while checking')
          for branch,sha in refs.items():
              if current.get(branch) != sha:
                  raise SystemExit('FAIL_CLOSED old branch SHA drift: '+branch)
              subprocess.run(['git','merge-base','--is-ancestor',sha,backup_source],check=True)
          # Unique historic manufacturing tool versions on divergent branches remain untouched.
          # automation-staging remains untouched as an operational branch.
          with open('/tmp/NAJXBOX_10_SAFE_BRANCHES.json','w') as f: json.dump(refs,f,indent=2)
          print('PASS: exact 10 original merged branch refs, SHA, current 4 releases, tools, git ancestry; Drive backup',backup_sha256)
          PY
      - name: Delete only the ten proven merged refs (never tools/source/master/main)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,os
          from urllib.parse import quote
          refs=json.load(open('/tmp/NAJXBOX_10_SAFE_BRANCHES.json'))
          repo=os.environ['GITHUB_REPOSITORY']
          done=[]
          for branch,expected in refs.items():
              endpoint='repos/'+repo+'/git/ref/heads/'+quote(branch,safe='/')
              found=subprocess.check_output(['gh','api',endpoint,'--jq','.object.sha'],text=True).strip()
              if found != expected:
                  raise SystemExit('FAIL_CLOSED branch changed during delete: '+branch)
              protected_endpoint='repos/'+repo+'/branches/'+quote(branch,safe='/')
              protected=subprocess.check_output(['gh','api',protected_endpoint,'--jq','.protected'],text=True).strip()
              if protected != 'false':
                  raise SystemExit('FAIL_CLOSED protected branch: '+branch)
              subprocess.run(['gh','api','-X','DELETE','repos/'+repo+'/git/refs/heads/'+quote(branch,safe='/')],check=True,stdout=subprocess.DEVNULL)
              done.append(branch)
              print('DELETED_REF',branch,expected)
          assert len(done)==10
          print('DELETE_10_ORIGINAL_MERGED_REFS_PASS; no file/tool/current-version mutation')
          PY
      - name: Independently read back surviving branches and protected package blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,os
          refs=json.load(open('/tmp/NAJXBOX_10_SAFE_BRANCHES.json'))
          raw=subprocess.check_output(['git','ls-remote','--heads','origin'],text=True)
          current={s.split()[1][len('refs/heads/'):]:s.split()[0] for s in raw.splitlines()}
          if any(name in current for name in refs):
              raise SystemExit('FAIL_CLOSED one or more targeted old branch refs still exists')
          if current['main'] != os.environ['GITHUB_SHA']:
              raise SystemExit('FAIL_CLOSED main modified or moved')
          for path,sha in {
             'channel.json':'51766850730fbf054ae09b1c0ffc899db859a6d2',
             'payloads/2.4.1.0/unified/CNBOX_PAYLOAD_1.2.1.zip':'d8895dee71eb7a357107751cd5b8bc95b2426405',
             'language/NAJXBOX_LANGUAGE_1.1.3_WOT_2.4.1.0_FINAL_LOCK_20261014.zip':'1d2be3e0f78c9ffcc52e8657404a7860177d36ef',
             'manager/NAJXBox_Manager.exe':'c8e8cd108fd7d581423b346c17ebd3bff9135f31',
             'manager/NAJXBox_Manager_Creator.exe':'2a940edb511e9ff34282be20d46d4183469b682c',
             'moe/1.3.1/NAJXBOX_MoE_1.3.1_WOT_2.4.1.0_FINAL_LOCK.zip':'759aaa698ebae7652f9ba0dbc20dfc4dc60151f0'
          }.items():
              actual=subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()
              if actual != sha: raise SystemExit('FAIL_CLOSED: current package drift '+path)
          print('INDEPENDENT_REVIEW_PASS; branch count:',len(current),'main:',current['main'])
          PY
