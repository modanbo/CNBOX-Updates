name: Build MoE independent 1.2.0-R1

on:
  push:
    branches:
      - work/moe-independent-120-review-20260924
    paths:
      - 'moe/independent/1.2.0-r1/**'
      - '.github/workflows/build-moe-independent-120.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Independent source tests
        run: |
          python3 moe/independent/1.2.0-r1/tests/test_independent.py
          python3 -m compileall -q moe/independent/1.2.0-r1/source

      - name: Verify locked reference assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum moe/rebuild/1.2.0/assets/najxbox_moe.swf | awk '{print $1}')" = "06b5af3c859de1f343a14e66dcc433cb99eee0e237b5131981f453a9eea2f851"
          python3 - <<'PY'
          import json
          p='moe/rebuild/1.2.0/assets/thresholds.json'
          d=json.load(open(p,'r',encoding='utf-8'))
          rows=d.get('table',d)
          good=0
          for _,r in rows.items():
              try:
                  ok=all(int(r.get(str(k),r.get(k,0)))>0 for k in (65,85,95,100))
              except Exception:
                  ok=False
              good += int(ok)
          print('threshold valid rows:',good)
          assert good == 778, good
          PY

      - name: Compile fresh source with CPython 2.7
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/moe_ind_py /tmp/moe_ind_stage /tmp/moe_ind_out
          mkdir -p /tmp/moe_ind_py /tmp/moe_ind_stage/res/scripts/client/gui/mods/najxbox_moe_independent /tmp/moe_ind_out
          cp -a moe/independent/1.2.0-r1/source/. /tmp/moe_ind_py/
          docker run --rm -v /tmp/moe_ind_py:/src python:2.7.18 python -m compileall -q /src
          cp /tmp/moe_ind_py/mod_najxbox_moe.pyc /tmp/moe_ind_stage/res/scripts/client/gui/mods/mod_najxbox_moe.pyc
          cp /tmp/moe_ind_py/najxbox_moe_independent/*.pyc /tmp/moe_ind_stage/res/scripts/client/gui/mods/najxbox_moe_independent/
          python3 - <<'PY'
          import glob
          files=glob.glob('/tmp/moe_ind_stage/**/*.pyc',recursive=True)
          print('pyc count:',len(files))
          assert len(files)==7, files
          for p in files:
              magic=open(p,'rb').read(4).hex()
              assert magic=='03f30d0a',(p,magic)
          PY

      - name: Assemble one-WOTMOD runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/moe_ind_stage/res/gui/flash /tmp/moe_ind_stage/res/mods/najxbox_moe
          cp moe/rebuild/1.2.0/assets/najxbox_moe.swf /tmp/moe_ind_stage/res/gui/flash/najxbox_moe.swf
          cp moe/rebuild/1.2.0/assets/thresholds.json /tmp/moe_ind_stage/res/mods/najxbox_moe/thresholds.json
          python3 - <<'PY'
          import os,zipfile,hashlib,json
          root='/tmp/moe_ind_stage'
          out='/tmp/moe_ind_out/najxbox.moe_independent_1.2.0-r1.wotmod'
          files=[]
          for base,_,names in os.walk(root):
              for n in names:
                  p=os.path.join(base,n)
                  a=os.path.relpath(p,root).replace(os.sep,'/')
                  files.append((a,p))
          files.sort()
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for a,p in files:
                  info=zipfile.ZipInfo(a,(2026,9,24,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o644<<16
                  z.writestr(info,open(p,'rb').read())
          h=hashlib.sha256(open(out,'rb').read()).hexdigest()
          inv={'runtime_files':[a for a,_ in files],'file_count':len(files),'wotmod_sha256':h,'wotmod_size':os.path.getsize(out)}
          open('/tmp/moe_ind_out/INVENTORY.json','w').write(json.dumps(inv,indent=2,sort_keys=True))
          print(json.dumps(inv,indent=2))
          assert len(files)==9
          assert not any(a.endswith('meta.xml') for a,_ in files)
          PY

      - name: Review 1 - owner and dependency gate
        shell: bash
        run: |
          set -euo pipefail
          unzip -l /tmp/moe_ind_out/najxbox.moe_independent_1.2.0-r1.wotmod
          ! unzip -l /tmp/moe_ind_out/najxbox.moe_independent_1.2.0-r1.wotmod | grep -Eiq 'protanki|champi|gambiter|modssettings|modslist|openwg|aslain'
          ! grep -RniE 'PlayerAvatar\.onBattleEvents|https?://|urllib2|requests\.|threading|tv\.protanki|champi\.|gambiter\.|modssettingsapi|modslistapi|openwg\.gameface' moe/independent/1.2.0-r1/source

      - name: Review 2 - package and rollback closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile,os,hashlib,json
          w='/tmp/moe_ind_out/najxbox.moe_independent_1.2.0-r1.wotmod'
          outer='/tmp/moe_ind_out/NAJXBOX_MoE_INDEPENDENT_1.2.0-R1_WOT_2.4.0.1.zip'
          arc='mods/2.4.0.1/najxbox.moe_independent_1.2.0-r1.wotmod'
          with zipfile.ZipFile(outer,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              info=zipfile.ZipInfo(arc,(2026,9,24,0,0,0))
              info.compress_type=zipfile.ZIP_DEFLATED
              info.external_attr=0o644<<16
              z.writestr(info,open(w,'rb').read())
          with zipfile.ZipFile(outer) as z:
              names=z.namelist()
          assert names==[arc],names
          result={
              'outer_zip':os.path.basename(outer),
              'outer_sha256':hashlib.sha256(open(outer,'rb').read()).hexdigest(),
              'outer_size':os.path.getsize(outer),
              'install_path':arc,
              'rollback_remove_exactly':[arc],
          }
          open('/tmp/moe_ind_out/REVIEW_RESULT.json','w').write(json.dumps(result,indent=2,sort_keys=True))
          print(json.dumps(result,indent=2))
          PY
          sha256sum /tmp/moe_ind_out/*

      - name: Upload independent test package
        uses: actions/upload-artifact@v4
        with:
          name: NAJXBOX_MoE_INDEPENDENT_1.2.0-R1
          path: |
            /tmp/moe_ind_out/NAJXBOX_MoE_INDEPENDENT_1.2.0-R1_WOT_2.4.0.1.zip
            /tmp/moe_ind_out/INVENTORY.json
            /tmp/moe_ind_out/REVIEW_RESULT.json
          if-no-files-found: error
