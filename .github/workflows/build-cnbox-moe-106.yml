name: Build CNBOX standalone MoE 1.0.6 candidate

on:
  push:
    branches:
      - work/moe-component-1.0.6
    paths:
      - 'moe/source/champi/**'
      - '.github/workflows/build-cnbox-moe-106.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/moe-component-1.0.6
          fetch-depth: 0

      - name: Fetch pinned EVV and FFDec
        shell: bash
        run: |
          set -euxo pipefail
          root="$RUNNER_TEMP/cnbox-moe-106"
          mkdir -p "$root/evv_outer" "$root/ffdec"

          curl -fL --retry 3 --connect-timeout 20 \
            'https://repo.aslain.com/wot_modmanager/Files/MarksOnGun/MarksOnGun_Expected_Vehicle_Values_2edd8787.zip' \
            -o "$root/evv.zip"
          echo '4fcb507d6ab133b959c99fa18af5c917e98b824f7a2b0e86210db5a3df87555c  '"$root"'/evv.zip' | sha256sum -c -
          unzip -q "$root/evv.zip" -d "$root/evv_outer"

          curl -fL --retry 3 --connect-timeout 20 \
            'https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.3.0/ffdec_26.3.0.zip' \
            -o "$root/ffdec.zip"
          echo '35f4930eb7c380afe66f2117f90b006deac0631473ad7500bb39c78f68645ecd  '"$root"'/ffdec.zip' | sha256sum -c -
          unzip -q "$root/ffdec.zip" -d "$root/ffdec"
          chmod +x "$root/ffdec/ffdec.sh"

      - name: Build garage-only EVV core
        shell: bash
        run: |
          set -euxo pipefail
          root="$RUNNER_TEMP/cnbox-moe-106"
          upstream="$root/evv_outer/mods/2.4.0.1/champi.expectedvehiclevalues2_2.05.000.wotmod"
          mkdir -p "$root/evv_core" "$root/verify_evv"
          unzip -q "$upstream" -d "$root/evv_core"

          # Neutralize EVV's battle PRESENTATION only. The protected CHAMPi backend and
          # garage model remain byte-identical.
          "$root/ffdec/ffdec.sh" -onerror abort -importScript \
            "$root/evv_core/res/gui/flash/evv_battle.swf" \
            "$root/evv_battle_cnbox.swf" \
            "$GITHUB_WORKSPACE/moe/source/champi"
          cp "$root/evv_battle_cnbox.swf" "$root/evv_core/res/gui/flash/evv_battle.swf"

          # Append a CSS-only CN garage skin. Do not touch EVV2.js / model semantics.
          cat "$GITHUB_WORKSPACE/moe/source/champi/EVV2/CNBOX_GARAGE_OVERRIDE.css" \
            >> "$root/evv_core/res/gui/gameface/mods/CHAMPi/EVV2/EVV2.css"

          mkdir -p "$root/evv_core/res/mods/cnbox.moe"
          cat > "$root/evv_core/res/mods/cnbox.moe/NOTICE_GARAGE.txt" <<'EOF'
          CNBOX MoE garage layer

          Backend/data model: CHAMPi Expected Vehicle Values 2.05.000.
          Upstream package: Aslain MarksOnGun_Expected_Vehicle_Values_2edd8787.zip.

          CNBOX changes only presentation:
          - EVV battle Flash is kept as a callback-compatible no-op so ProTanki owns battle UI.
          - EVV garage GameFace keeps the original model/drag/savePosition logic.
          - EVV2.css receives a compact CN garage-card override.

          Required model values are original EVV fields:
          moePercent, moeCurrentPercent, moePercentDelta, moeAVG,
          moe1(65), moe2(85), moe3(95), moe4(100).

          No CHAMPi Python calculation/backend member is modified.
          EOF
          sed -i 's/^          //' "$root/evv_core/res/mods/cnbox.moe/NOTICE_GARAGE.txt"

          # Export the modified battle view and prove the callback surface still exists
          # while no panel is created.
          "$root/ffdec/ffdec.sh" -export script "$root/verify_evv" \
            "$root/evv_core/res/gui/flash/evv_battle.swf"
          view="$root/verify_evv/scripts/de/champi/wot/evv/views/battle/ExpectedVehicleValueBattle.as"
          test -f "$view"
          grep -Fq 'public var py_getSettings:Function;' "$view"
          grep -Fq 'public var py_savePosition:Function;' "$view"
          grep -Fq 'public function as_setText(param1:String)' "$view"
          grep -Fq 'public function as_setText_WNX(param1:String)' "$view"
          grep -Fq 'public function as_setPanelsVisible(param1:Boolean)' "$view"
          if grep -Fq 'new LabelWithBackground' "$view"; then
            echo 'EVV battle panel creation unexpectedly survived' >&2
            exit 1
          fi

          css="$root/evv_core/res/gui/gameface/mods/CHAMPi/EVV2/EVV2.css"
          grep -Fq '#evv2-root .evv2-progress' "$css"
          grep -Fq 'content: "平均标伤";' "$css"
          grep -Fq 'data-percent="65"' "$css"
          grep -Fq 'data-percent="85"' "$css"
          grep -Fq 'data-percent="95"' "$css"
          grep -Fq 'data-percent="100"' "$css"

      - name: Prove EVV backend unchanged and repack core
        shell: bash
        run: |
          set -euxo pipefail
          root="$RUNNER_TEMP/cnbox-moe-106"
          upstream="$root/evv_outer/mods/2.4.0.1/champi.expectedvehiclevalues2_2.05.000.wotmod"
          out="$root/champi.expectedvehiclevalues2_2.05.000.wotmod"

          python3 - "$upstream" "$root/evv_core" "$out" <<'PY'
          import hashlib, os, sys, zipfile
          upstream,src,out=sys.argv[1:4]

          with zipfile.ZipFile(upstream) as u:
              upstream_files={i.filename for i in u.infolist() if not i.is_dir()}
              upstream_hash={n:hashlib.sha256(u.read(n)).hexdigest() for n in upstream_files}

          rows=[]
          for dp,_,fs in os.walk(src):
              for name in fs:
                  p=os.path.join(dp,name)
                  arc=os.path.relpath(p,src).replace(os.sep,'/')
                  rows.append((arc,p))
          rows.sort()

          new_files={arc for arc,_ in rows}
          allowed_changed={
              'res/gui/flash/evv_battle.swf',
              'res/gui/gameface/mods/CHAMPi/EVV2/EVV2.css',
          }
          allowed_added={'res/mods/cnbox.moe/NOTICE_GARAGE.txt'}

          assert new_files-upstream_files == allowed_added, new_files-upstream_files
          assert upstream_files-new_files == set(), upstream_files-new_files

          for arc,p in rows:
              if arc in allowed_changed or arc in allowed_added:
                  continue
              h=hashlib.sha256(open(p,'rb').read()).hexdigest()
              assert h == upstream_hash[arc], arc

          protected='res/scripts/client/gui/mods/mod_evv.pyc'
          h=hashlib.sha256(open(os.path.join(src,protected),'rb').read()).hexdigest()
          assert h == upstream_hash[protected]
          print('STATIC_EVV_BACKEND_UNCHANGED_OK',h)

          with zipfile.ZipFile(out,'w',zipfile.ZIP_STORED) as z:
              for arc,p in rows:
                  zi=zipfile.ZipInfo(arc,(1980,1,1,0,0,0))
                  zi.compress_type=zipfile.ZIP_STORED
                  zi.external_attr=0o644<<16
                  z.writestr(zi,open(p,'rb').read())
          PY

      - name: Compose ProTanki battle plus EVV garage payload
        shell: bash
        run: |
          set -euxo pipefail
          root="$RUNNER_TEMP/cnbox-moe-106"
          payload="$root/payload"
          out="$GITHUB_WORKSPACE/moe/1.0.6"
          rm -rf "$payload" "$out"
          mkdir -p "$payload" "$out"

          # Start from already-published 1.0.5 battle candidate. This preserves the
          # exact ProTanki battle WOTMOD and the Manager's first-install config behavior.
          unzip -q "$GITHUB_WORKSPACE/moe/1.0.5/CNBOX_MoE_1.0.5_WOT_2.4.0.1.zip" -d "$payload"

          # Add EVV garage core + its pinned framework dependencies.
          cp "$root/champi.expectedvehiclevalues2_2.05.000.wotmod" \
             "$payload/mods/2.4.0.1/"
          cp "$root/evv_outer/mods/2.4.0.1/champi.settingsgui_1.81.wotmod" \
             "$payload/mods/2.4.0.1/"
          cp "$root/evv_outer/mods/2.4.0.1/gambiter.guiflash_0.6.6.wotmod" \
             "$payload/mods/2.4.0.1/"
          cp "$root/evv_outer/mods/2.4.0.1/aslain.modmenu_2.0.17.wotmod" \
             "$payload/mods/2.4.0.1/"
          mkdir -p "$payload/mods/2.4.0.1/net.openwg"
          cp "$root/evv_outer/mods/2.4.0.1/net.openwg/net.openwg.gameface_1.1.6.wotmod" \
             "$payload/mods/2.4.0.1/net.openwg/"

          python3 - "$payload" "$out" <<'PY'
          import hashlib,json,os,sys,zipfile
          payload,outdir=sys.argv[1:3]
          archive=os.path.join(outdir,'CNBOX_MoE_1.0.6_WOT_2.4.0.1.zip')

          rows=[]
          for dp,_,fs in os.walk(payload):
              for name in fs:
                  p=os.path.join(dp,name)
                  rows.append((os.path.relpath(p,payload).replace(os.sep,'/'),p))
          rows.sort()

          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for arc,p in rows:
                  zi=zipfile.ZipInfo(arc,(1980,1,1,0,0,0))
                  zi.compress_type=zipfile.ZIP_DEFLATED
                  zi.external_attr=0o644<<16
                  z.writestr(zi,open(p,'rb').read())

          def sha(p):
              h=hashlib.sha256()
              with open(p,'rb') as fh:
                  for b in iter(lambda:fh.read(1024*1024),b''):
                      h.update(b)
              return h.hexdigest()

          specs=[
            ('mods/{WOT_VERSION}/izeberg.modssettingsapi_1.7.0.wotmod',
             payload+'/mods/2.4.0.1/izeberg.modssettingsapi_1.7.0.wotmod',True),
            ('mods/{WOT_VERSION}/me.poliroid.modslistapi_1.7.9.wotmod',
             payload+'/mods/2.4.0.1/me.poliroid.modslistapi_1.7.9.wotmod',True),
            ('mods/{WOT_VERSION}/net.openwg/net.openwg.gameface_1.1.6.wotmod',
             payload+'/mods/2.4.0.1/net.openwg/net.openwg.gameface_1.1.6.wotmod',True),
            ('mods/{WOT_VERSION}/aslain.modmenu_2.0.17.wotmod',
             payload+'/mods/2.4.0.1/aslain.modmenu_2.0.17.wotmod',True),
            ('mods/{WOT_VERSION}/champi.settingsgui_1.81.wotmod',
             payload+'/mods/2.4.0.1/champi.settingsgui_1.81.wotmod',True),
            ('mods/{WOT_VERSION}/gambiter.guiflash_0.6.6.wotmod',
             payload+'/mods/2.4.0.1/gambiter.guiflash_0.6.6.wotmod',True),
            ('mods/{WOT_VERSION}/tv.protanki.gunmarkscalc_8.1.01.wotmod',
             payload+'/mods/2.4.0.1/tv.protanki.gunmarkscalc_8.1.01.wotmod',False),
            ('mods/{WOT_VERSION}/champi.expectedvehiclevalues2_2.05.000.wotmod',
             payload+'/mods/2.4.0.1/champi.expectedvehiclevalues2_2.05.000.wotmod',False),
          ]

          # The ProTanki battle core must stay exactly the already-published 1.0.5 build.
          assert sha(payload+'/mods/2.4.0.1/tv.protanki.gunmarkscalc_8.1.01.wotmod') == \
              'b0120e0ebf5b1f4ac0f44d63fab594021d96e71cd7aabb0263db44b64a00a924'

          manifest={
            'id':'CNBOX_MOE',
            'version':'1.0.6',
            'status':'GARAGE_INTEGRATION_CANDIDATE',
            'wotVersion':'2.4.0.1',
            'sourceCore':'ProTanki 8.1.01 battle + CHAMPi EVV 2.05.000 garage',
            'sourceUrl':'https://protanki.tv/ ; https://wgmods.net/4322/',
            'payloadUrl':'https://raw.githubusercontent.com/modanbo/CNBOX-Updates/main/moe/1.0.6/CNBOX_MoE_1.0.6_WOT_2.4.0.1.zip',
            'payloadSha256':sha(archive),
            'notes':'Independent Manager MoE candidate. ProTanki owns battle UI/calculation; CHAMPi EVV provides garage MoE model/65-85-95-100 thresholds/drag persistence. EVV battle presentation is callback-compatible but intentionally blank. Box remains unrelated.',
            'installedFiles':[
              {'path':rel,'sha256':sha(p),'required':True,'shared':shared}
              for rel,p,shared in specs
            ]
          }
          with open(os.path.join(outdir,'manifest.json'),'w',encoding='utf-8') as fh:
              json.dump(manifest,fh,ensure_ascii=False,indent=2); fh.write('\n')
          with open(os.path.join(outdir,'SHA256SUMS.txt'),'w') as fh:
              fh.write(manifest['payloadSha256']+'  '+os.path.basename(archive)+'\n')
              for spec,(_,p,_) in zip(manifest['installedFiles'],specs):
                  fh.write(spec['sha256']+'  '+spec['path']+'\n')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Static combined-package closure
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import hashlib,json,zipfile
          m=json.load(open('moe/1.0.6/manifest.json',encoding='utf-8'))
          payload='moe/1.0.6/CNBOX_MoE_1.0.6_WOT_2.4.0.1.zip'
          assert hashlib.sha256(open(payload,'rb').read()).hexdigest()==m['payloadSha256']

          with zipfile.ZipFile(payload) as z:
              names=set(z.namelist())
              assert 'mods/2.4.0.1/tv.protanki.gunmarkscalc_8.1.01.wotmod' in names
              assert 'mods/2.4.0.1/champi.expectedvehiclevalues2_2.05.000.wotmod' in names
              assert 'mods/configs/protanki/gunMarksCalculator.json' in names

              evv=z.read('mods/2.4.0.1/champi.expectedvehiclevalues2_2.05.000.wotmod')
          open('/tmp/evv.wotmod','wb').write(evv)

          with zipfile.ZipFile('/tmp/evv.wotmod') as e:
              assert all(i.compress_type==zipfile.ZIP_STORED for i in e.infolist())
              css=e.read('res/gui/gameface/mods/CHAMPi/EVV2/EVV2.css').decode('utf-8','replace')
              assert 'CNBOX garage MoE skin' in css
              assert 'content: "平均标伤";' in css
              assert 'NOTICE_GARAGE.txt' in '\n'.join(e.namelist())

          print('STATIC_MOE_106_COMBINED_PACKAGE_OK')
          PY

      - name: Commit deterministic 1.0.6 candidate
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add moe/1.0.6
          if git diff --cached --quiet; then
            echo 'No output changes.'
            exit 0
          fi
          git commit -m 'Build CNBOX standalone MoE 1.0.6 candidate'
          git pull --rebase origin work/moe-component-1.0.6
          git push origin HEAD:work/moe-component-1.0.6
