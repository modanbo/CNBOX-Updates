name: build-moe-129-native-pure-hangar-mask-r3

on:
  push:
    branches:
      - work/moe-1.2.9-lobby-mask-candidate-20260927
    paths:
      - '.github/workflows/build-moe-129-native-pure-hangar-mask.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/moe-1.2.9-lobby-mask-candidate-20260927

      - name: Verify exact 1.2.8 authority
        shell: bash
        run: |
          set -euxo pipefail
          pkg='moe/1.2.8/NAJXBOX_MoE_INDEPENDENT_1.2.8_BATTLEPAGE_RUNTIME_FIX_WOT_2.4.0.1.zip'
          echo '71bc51dff5e3b72d835b97f41267b2e9d6e445bd030706cc8145ef31c8966a2e  '"$pkg" | sha256sum -c -
          root="$RUNNER_TEMP/moe129"
          rm -rf "$root" out129
          mkdir -p "$root/outer" "$root/original" out129
          unzip -q "$pkg" -d "$root/outer"
          wotmod=$(find "$root/outer" -type f -name '*.wotmod' -print -quit)
          test -n "$wotmod"
          echo '7ec910ae68d82904b22ad984a4db14f3874f5abf010ce780ab6f97cc654190cb  '"$wotmod" | sha256sum -c -
          cp "$wotmod" "$root/original/current.wotmod"

      - name: Write R3 Hangar-state plus foreground-blocker helper
        shell: bash
        run: |
          set -euxo pipefail
          cat > out129/mod_najxbox_moe_lobby_visibility.py <<'PY'
          # -*- coding: utf-8 -*-
          import traceback

          _TAG = '[NAJXBox.MoE.Visibility]'
          _LOBBY_ALIAS = 'NAJXBOX_MOE_INDEPENDENT_LOBBY'
          _LAST_HANGAR_VISIBLE = None
          _WINDOW_LISTENER_BOUND = False

          LobbyStateMachine = None
          WindowLayer = None
          POP_UP_CRITERIA = None
          APP_NAME_SPACE = None
          ServicesLocator = None

          try:
              from gui.lobby_state_machine.lobby_state_machine import LobbyStateMachine
              from gui.Scaleform.framework import WindowLayer
              from gui.Scaleform.framework.managers.containers import POP_UP_CRITERIA
              from gui.app_loader.settings import APP_NAME_SPACE
              from gui.shared.personality import ServicesLocator
          except Exception:
              print _TAG, 'core import failed'
              traceback.print_exc()

          isInHangarState = None
          dependency = None
          IGuiLoader = None

          try:
              from gui.lobby_state_machine.states import isInHangarState
              from helpers import dependency
              from skeletons.gui.impl import IGuiLoader
          except Exception:
              print _TAG, 'native visibility import failed'
              traceback.print_exc()

          def _lobby_view():
              try:
                  if ServicesLocator is None or APP_NAME_SPACE is None or WindowLayer is None or POP_UP_CRITERIA is None:
                      return None
                  app = ServicesLocator.appLoader.getApp(APP_NAME_SPACE.SF_LOBBY)
                  if app is None:
                      print _TAG, 'SF_LOBBY app not ready'
                      return None
                  manager = getattr(app, 'containerManager', None)
                  if manager is None:
                      print _TAG, 'containerManager not ready'
                      return None
                  criteria = {POP_UP_CRITERIA.VIEW_ALIAS: _LOBBY_ALIAS}
                  return manager.getView(WindowLayer.WINDOW, criteria)
              except Exception:
                  print _TAG, 'find lobby view failed'
                  traceback.print_exc()
                  return None

          def _window_manager():
              try:
                  if dependency is None or IGuiLoader is None:
                      return None
                  gui = dependency.instance(IGuiLoader)
                  if gui is None:
                      return None
                  return getattr(gui, 'windowsManager', None)
              except Exception:
                  print _TAG, 'windowsManager lookup failed'
                  traceback.print_exc()
                  return None

          def _foreground_blocker_windows():
              try:
                  if WindowLayer is None or WindowStatus is None:
                      return None
                  manager = _window_manager()
                  if manager is None:
                      return None
                  blocker_layers = (
                      WindowLayer.FULLSCREEN_WINDOW,
                      WindowLayer.OVERLAY,
                      WindowLayer.TOP_SUB_VIEW)
                  active_statuses = (
                      WindowStatus.LOADING,
                      WindowStatus.LOADED)
                  return manager.findWindows(
                      lambda w: w.layer in blocker_layers and
                      getattr(w, 'windowStatus', None) in active_statuses)
              except Exception:
                  print _TAG, 'foreground blocker lookup failed'
                  traceback.print_exc()
                  return None

          def _is_pure_hangar():
              try:
                  if isInHangarState is None:
                      return False
                  if not isInHangarState():
                      return False

                  blockers = _foreground_blocker_windows()
                  if blockers is None:
                      return False
                  if len(blockers) > 0:
                      print _TAG, 'foreground blockers=', len(blockers)
                      return False

                  # Important R3 rule:
                  # do not count SUB_VIEW windows and do not whitelist the active
                  # SUB_VIEW alias. Vehicle selection can churn normal Hangar
                  # window/view objects without leaving the Hangar state.
                  return True
              except Exception:
                  print _TAG, 'pure-hangar check failed'
                  traceback.print_exc()
                  return False

          def _is_blocker_window_event(unique_id):
              try:
                  manager = _window_manager()
                  if manager is None or WindowLayer is None:
                      return False
                  window = manager.getWindow(unique_id)
                  if window is None:
                      return False
                  return getattr(window, 'layer', None) in (
                      WindowLayer.FULLSCREEN_WINDOW,
                      WindowLayer.OVERLAY,
                      WindowLayer.TOP_SUB_VIEW)
              except Exception:
                  return False

          def _apply(visible, returning_to_hangar):
              view = _lobby_view()
              if view is None:
                  print _TAG, 'lobby view not found'
                  return

              visible = bool(visible)
              try:
                  # 1.2.8 LobbyView owns this state. Keep it synchronized;
                  # its _apply_hangar_visibility argument is a retry counter.
                  if hasattr(view, '_hangar_visible'):
                      view._hangar_visible = visible

                  flash = getattr(view, 'flashObject', None)
                  if flash is not None:
                      # Restore official-CN persistent mask semantics first.
                      # While masked, later as_updateData cannot re-show panel.
                      mask_fn = getattr(flash, 'as_setMaskLobbyPanel', None)
                      if mask_fn is not None:
                          mask_fn(not visible)
                          print _TAG, 'MASK', bool(not visible)

                  fn = getattr(view, '_apply_hangar_visibility', None)
                  if fn is not None:
                      fn(0)
                      print _TAG, 'APPLY', visible, 'via synchronized view state'
                  elif flash is not None:
                      if visible:
                          flash.as_showLobbyPanel()
                          print _TAG, 'SHOW direct'
                      else:
                          flash.as_hideLobbyPanel()
                          print _TAG, 'HIDE direct'

                  # Preserve the already Runtime-proven return refresh chain.
                  if visible and returning_to_hangar:
                      refresh = getattr(view, '_on_vehicle', None)
                      if refresh is not None:
                          refresh()
                          print _TAG, 'REFRESH vehicle-changed on hangar return'
                      else:
                          push = getattr(view, '_push', None)
                          if push is not None:
                              push('hangar-return')
                              print _TAG, 'REFRESH push on hangar return'
              except Exception:
                  print _TAG, 'apply/refresh visibility failed'
                  traceback.print_exc()

          def _recheck(reason):
              global _LAST_HANGAR_VISIBLE
              try:
                  visible = bool(_is_pure_hangar())
                  returning = (_LAST_HANGAR_VISIBLE is False and visible is True)
                  print _TAG, 'recheck=', reason, 'pure_hangar=', visible, 'returning=', returning
                  _apply(visible, returning)
                  _LAST_HANGAR_VISIBLE = visible
              except Exception:
                  print _TAG, 'recheck failed', reason
                  traceback.print_exc()

          def _on_window_status_changed(*args, **kwargs):
              try:
                  unique_id = args[0] if args else None
                  if unique_id is not None and _is_blocker_window_event(unique_id):
                      _recheck('foreground-window-status')
              except Exception:
                  print _TAG, 'window-status callback failed'
                  traceback.print_exc()

          def _ensure_window_listener():
              global _WINDOW_LISTENER_BOUND
              if _WINDOW_LISTENER_BOUND:
                  return True
              try:
                  manager = _window_manager()
                  if manager is None:
                      return False
                  manager.onWindowStatusChanged += _on_window_status_changed
                  _WINDOW_LISTENER_BOUND = True
                  print _TAG, 'window-status listener installed'
                  return True
              except Exception:
                  print _TAG, 'window-status listener install failed'
                  traceback.print_exc()
                  return False

          if LobbyStateMachine is not None:
              try:
                  _ORIGINAL_UPDATE_VISIBLE_ROUTE = LobbyStateMachine._LobbyStateMachine__updateVisibleRoute

                  def _najx_update_visible_route(self):
                      result = _ORIGINAL_UPDATE_VISIBLE_ROUTE(self)
                      try:
                          _ensure_window_listener()
                          _recheck('route')
                      except Exception:
                          print _TAG, 'route update failed'
                          traceback.print_exc()
                      return result

                  LobbyStateMachine._LobbyStateMachine__updateVisibleRoute = _najx_update_visible_route
                  print _TAG, '1.2.9 R3 hangar-state+foreground-blocker+official-mask helper installed'
                  _ensure_window_listener()
              except Exception:
                  print _TAG, 'hook install failed'
                  traceback.print_exc()
          PY

      - name: Compile helper with CPython 2.7
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm -v "$PWD/out129:/out" python:2.7-slim sh -lc "python -m py_compile /out/mod_najxbox_moe_lobby_visibility.py && python - <<'PY'
          import hashlib
          p='/out/mod_najxbox_moe_lobby_visibility.pyc'
          d=open(p,'rb').read()
          print('PYC_MAGIC=' + d[:4].encode('hex'))
          print('PYC_SHA256=' + hashlib.sha256(d).hexdigest())
          PY"
          test "$(xxd -p -l 4 out129/mod_najxbox_moe_lobby_visibility.pyc)" = "03f30d0a"

      - name: Rebuild only helper plus meta as ZIP Stored
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import zipfile, hashlib, xml.etree.ElementTree as ET, os, json
          root=os.environ['RUNNER_TEMP']+'/moe129'
          src=root+'/original/current.wotmod'
          dst='out129/najxbox.moe_independent_1.2.4.wotmod'
          helper='out129/mod_najxbox_moe_lobby_visibility.pyc'
          helper_name='res/scripts/client/gui/mods/mod_najxbox_moe_lobby_visibility.pyc'
          changed={helper_name, 'meta.xml'}

          with zipfile.ZipFile(src,'r') as zin:
              infos=zin.infolist()
              original={i.filename:zin.read(i.filename) for i in infos}

          meta=original['meta.xml'].decode('utf-8')
          meta=meta.replace('<version>1.2.8</version>','<version>1.2.9</version>')
          meta=meta.replace(
              '<description>1.2.4 baseline + NA BattlePage compatibility guard; no data/drag/lifecycle changes</description>',
              '<description>1.2.8 baseline + Hangar-state foreground-blocker mask semantics; BattlePage guard retained</description>')
          ET.fromstring(meta)
          replacement={
              'meta.xml':meta.encode('utf-8'),
              helper_name:open(helper,'rb').read()
          }

          with zipfile.ZipFile(dst,'w') as zout:
              for info in infos:
                  data=replacement.get(info.filename,original[info.filename])
                  zi=zipfile.ZipInfo(info.filename, info.date_time)
                  zi.comment=info.comment
                  zi.extra=info.extra
                  zi.create_system=info.create_system
                  zi.create_version=info.create_version
                  zi.extract_version=info.extract_version
                  zi.flag_bits=info.flag_bits
                  zi.volume=info.volume
                  zi.internal_attr=info.internal_attr
                  zi.external_attr=info.external_attr
                  zi.compress_type=zipfile.ZIP_STORED
                  zout.writestr(zi,data)

          def sha(b): return hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile(dst,'r') as z:
              candidate={i.filename:z.read(i.filename) for i in z.infolist()}
              cinfos=z.infolist()

          assert [i.filename for i in infos] == [i.filename for i in cinfos]
          assert all(i.compress_type == zipfile.ZIP_STORED for i in cinfos)
          diffs=[name for name in original if original[name] != candidate[name]]
          assert set(diffs) == changed, diffs
          assert candidate[helper_name][:4] == bytes.fromhex('03f30d0a')
          xml=ET.fromstring(candidate['meta.xml'])
          assert xml.findtext('id') == 'najxbox.moe.independent'
          assert xml.findtext('version') == '1.2.9'

          locked=[
              'res/gui/flash/najxbox_moe_en.swf',
              'res/gui/flash/najxbox_moe_zh.swf',
              'res/mods/najxbox_moe/thresholds.json',
              'res/scripts/client/gui/mods/mod_najxbox_moe.pyc',
              'res/scripts/client/gui/mods/najxbox_moe_independent/__init__.pyc',
              'res/scripts/client/gui/mods/najxbox_moe_independent/bridge.pyc',
              'res/scripts/client/gui/mods/najxbox_moe_independent/datasource.pyc',
              'res/scripts/client/gui/mods/najxbox_moe_independent/mathcore.pyc',
              'res/scripts/client/gui/mods/najxbox_moe_independent/storage.pyc',
              'res/scripts/client/gui/mods/najxbox_moe_independent/ui.pyc'
          ]
          for name in locked:
              assert original[name] == candidate[name], name

          report={
              'base_wotmod_sha256':hashlib.sha256(open(src,'rb').read()).hexdigest(),
              'candidate_wotmod_sha256':hashlib.sha256(open(dst,'rb').read()).hexdigest(),
              'changed_members':diffs,
              'all_inner_members_stored':True,
              'helper_magic':candidate[helper_name][:4].hex(),
              'locked_member_sha256':{n:sha(candidate[n]) for n in locked}
          }
          open('out129/STATIC_DIFF.json','w').write(json.dumps(report,indent=2,sort_keys=True))
          print(json.dumps(report,indent=2,sort_keys=True))
          PY

      - name: Build private Runtime candidate outer ZIP
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out129/package/mods/2.4.0.1
          cp out129/najxbox.moe_independent_1.2.4.wotmod out129/package/mods/2.4.0.1/
          (cd out129/package && zip -q -9 -r ../NAJXBOX_MoE_INDEPENDENT_1.2.9_NATIVE_PURE_HANGAR_MASK_R3_WOT_2.4.0.1_TEST_CANDIDATE.zip mods)
          sha256sum out129/NAJXBOX_MoE_INDEPENDENT_1.2.9_NATIVE_PURE_HANGAR_MASK_R3_WOT_2.4.0.1_TEST_CANDIDATE.zip > out129/CANDIDATE_SHA256.txt
          sha256sum out129/najxbox.moe_independent_1.2.4.wotmod > out129/CANDIDATE_WOTMOD_SHA256.txt

      - name: Review 1 - owner and package boundary
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('out129/STATIC_DIFF.json'))
          assert set(r['changed_members']) == {'meta.xml','res/scripts/client/gui/mods/mod_najxbox_moe_lobby_visibility.pyc'}
          assert r['all_inner_members_stored'] is True
          assert r['helper_magic'] == '03f30d0a'
          src=open('out129/mod_najxbox_moe_lobby_visibility.py',encoding='utf-8').read()
          assert 'isInHangarState' in src
          assert 'IGuiLoader' in src
          assert 'onWindowStatusChanged' in src
          assert 'WindowLayer.FULLSCREEN_WINDOW' in src
          assert 'WindowLayer.OVERLAY' in src
          assert 'WindowLayer.TOP_SUB_VIEW' in src
          assert 'WindowLayer.SUB_VIEW' not in src
          assert '_foreground_blocker_windows' in src
          assert '_is_blocker_window_event' in src
          assert "view._hangar_visible = visible" in src
          assert 'as_setMaskLobbyPanel' in src
          assert 'mask_fn(not visible)' in src
          assert 'fn(0)' in src
          assert 'fn(bool(visible))' not in src
          assert '_on_vehicle' in src
          assert "'hangar' in sid" not in src
          assert 'techtree' not in src.lower()
          assert 'lootbox' not in src.lower()
          assert 'PlayerAvatar' not in src
          assert 'onBattleEvents' not in src
          assert 'g_appLoader' not in src
          assert 'LobbySimpleEvent' not in src
          assert 'protanki' not in src.lower()
          assert 'expectedvehiclevalues' not in src.lower()
          open('out129/REVIEW_1.md','w').write(
              '# Review 1 — PASS\n\n'
              '- Base: exact MoE 1.2.8 FINAL_LOCK.\n'
              '- Changed runtime code: Lobby visibility helper only.\n'
              '- meta.xml: version/description only.\n'
              '- Uses WoT 2.4.0.1 Hangar state as the base owner plus generic higher-layer blockers.\n'
              '- No page-name blacklist and no SUB_VIEW counting/alias whitelist; future non-Hangar routes fail closed, while FULLSCREEN/OVERLAY/TOP_SUB_VIEW block Hangar display.\n'
              '- Restores official SWF mask semantics before show/hide.\n'
              '- Existing LobbyView _hangar_visible is synchronized; retry-counter API called with 0.\n'
              '- Existing return-to-Hangar _on_vehicle refresh retained.\n'
              '- No data/battle/drag/storage/threshold owner changes.\n'
              '- Inner WOTMOD remains ZIP Stored / method 0.\n'
              '- Python 2.7 magic 03f30d0a.\n'
          )
          PY

      - name: Review 2 - regression and rollback closure
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json,zipfile,xml.etree.ElementTree as ET
          r=json.load(open('out129/STATIC_DIFF.json'))
          assert r['base_wotmod_sha256'] == '7ec910ae68d82904b22ad984a4db14f3874f5abf010ce780ab6f97cc654190cb'
          cand='out129/najxbox.moe_independent_1.2.4.wotmod'
          with zipfile.ZipFile(cand) as z:
              assert len(z.infolist()) == 12
              assert all(i.compress_type == 0 for i in z.infolist())
              assert z.read('res/scripts/client/gui/mods/najxbox_moe_independent/ui.pyc')[:4] == bytes.fromhex('03f30d0a')
              root=ET.fromstring(z.read('meta.xml'))
              assert root.findtext('version') == '1.2.9'
          outer='out129/NAJXBOX_MoE_INDEPENDENT_1.2.9_NATIVE_PURE_HANGAR_MASK_R3_WOT_2.4.0.1_TEST_CANDIDATE.zip'
          with zipfile.ZipFile(outer) as z:
              assert z.namelist() == ['mods/','mods/2.4.0.1/','mods/2.4.0.1/najxbox.moe_independent_1.2.4.wotmod']
          open('out129/REVIEW_2.md','w').write(
              '# Review 2 — PASS\n\n'
              '- Exactly 12 inner members retained.\n'
              '- No SWF bytes changed.\n'
              '- No datasource/bridge/math/storage/ui.pyc bytes changed.\n'
              '- 1.2.8 BattlePage compatibility bytes retained.\n'
              '- Candidate install path remains the exact existing WOTMOD path.\n'
              '- Rollback authority remains 1.2.8 WOTMOD SHA256 7ec910ae68d82904b22ad984a4db14f3874f5abf010ce780ab6f97cc654190cb.\n'
              '- R1/R2 remain failed Runtime evidence; R3 rebases from exact 1.2.8, not from either failed candidate.\n'
              '- Candidate is TEST_CANDIDATE only; no channel/manifest/public promotion performed.\n'
              '- Runtime first gate: game startup must show no WOTMOD load rejection.\n'
          )
          PY

      - name: Upload private candidate and reviews
        uses: actions/upload-artifact@v4
        with:
          name: moe-1.2.9-native-pure-hangar-mask-r3-test-candidate
          path: |
            out129/NAJXBOX_MoE_INDEPENDENT_1.2.9_NATIVE_PURE_HANGAR_MASK_R3_WOT_2.4.0.1_TEST_CANDIDATE.zip
            out129/CANDIDATE_SHA256.txt
            out129/CANDIDATE_WOTMOD_SHA256.txt
            out129/STATIC_DIFF.json
            out129/REVIEW_1.md
            out129/REVIEW_2.md
            out129/mod_najxbox_moe_lobby_visibility.py
          if-no-files-found: error
