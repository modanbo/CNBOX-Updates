name: Inspect Expected Vehicle Values package

on:
  push:
    branches:
      - work/moe-garage-decompose
    paths:
      - ".github/workflows/inspect-evv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/moe-garage-decompose

      - name: Download and decompose EVV
        shell: bash
        run: |
          set -euxo pipefail
          root="$RUNNER_TEMP/evv"
          mkdir -p "$root/out" "$GITHUB_WORKSPACE/moe/garage_diagnostics/evv"

          url="https://repo.aslain.com/wot_modmanager/Files/MarksOnGun/MarksOnGun_Expected_Vehicle_Values_2edd8787.zip"
          curl -fL --retry 3 --connect-timeout 20 "$url" -o "$root/evv.zip"
          sha256sum "$root/evv.zip" > "$GITHUB_WORKSPACE/moe/garage_diagnostics/evv/package_sha256.txt"
          unzip -q "$root/evv.zip" -d "$root/out"

          {
            echo "=== OUTER MEMBERS ==="
            unzip -Z1 "$root/evv.zip" | sort
            echo
            echo "=== ALL EXTRACTED FILES ==="
            find "$root/out" -type f | sed "s#^$root/out/##" | sort
            echo
            echo "=== TOP HASHES ==="
            find "$root/out" -type f -print0 | sort -z | xargs -0 sha256sum
          } > "$GITHUB_WORKSPACE/moe/garage_diagnostics/evv/structure.txt"

          python3 - "$root/out" "$GITHUB_WORKSPACE/moe/garage_diagnostics/evv/nested_wotmods.txt" <<'PY'
          import os,sys,zipfile,re
          root,out=sys.argv[1],sys.argv[2]
          with open(out,"w",encoding="utf-8") as fh:
              for dp,_,fs in os.walk(root):
                  for n in fs:
                      p=os.path.join(dp,n)
                      if not (n.endswith(".wotmod") or n.endswith(".mtmod") or n.endswith(".zip")):
                          continue
                      fh.write("\n=== "+os.path.relpath(p,root)+" ===\n")
                      try:
                          with zipfile.ZipFile(p) as z:
                              for name in z.namelist():
                                  low=name.lower()
                                  if any(k in low for k in ("garage","hangar","battle","mark","moe","gameface","script","config","settings","flash")):
                                      fh.write(name+"\n")
                              if "meta.xml" in z.namelist():
                                  fh.write("--- META ---\n")
                                  fh.write(z.read("meta.xml").decode("utf-8","replace")+"\n")
                      except Exception as e:
                          fh.write("NOT_ZIP "+repr(e)+"\n")
          PY

          {
            echo "=== GARAGE/HANGAR REFERENCES ==="
            grep -RniE "garage|hangar|selectedVehicle|vehicleSelected|carousel|marksOnGun|MoE|mark" "$root/out" 2>/dev/null | head -n 1200 || true
          } > "$GITHUB_WORKSPACE/moe/garage_diagnostics/evv/text_refs.txt"

      - name: Export EVV garage UI and GameFace contract
        shell: bash
        run: |
          set -euxo pipefail
          root="$RUNNER_TEMP/evv"
          core="$root/out/mods/2.4.0.1/champi.expectedvehiclevalues2_2.05.000.wotmod"
          mkdir -p "$root/core" "$root/ffdec" "$root/garage_scripts" "$root/battle_scripts" \
                   "$GITHUB_WORKSPACE/moe/garage_diagnostics/evv/gameface" \
                   "$GITHUB_WORKSPACE/moe/garage_diagnostics/evv/garage_flash" \
                   "$GITHUB_WORKSPACE/moe/garage_diagnostics/evv/battle_flash"
          unzip -q -o "$core" -d "$root/core"

          cp "$root/core/res/gui/gameface/mods/CHAMPi/EVV2/EVV2.js"              "$GITHUB_WORKSPACE/moe/garage_diagnostics/evv/gameface/EVV2.js"
          cp "$root/core/res/gui/gameface/mods/CHAMPi/EVV2/EVV2.css"              "$GITHUB_WORKSPACE/moe/garage_diagnostics/evv/gameface/EVV2.css"
          cp "$root/core/res/gui/gen_resources/de.champi.evv2.garage.json"              "$GITHUB_WORKSPACE/moe/garage_diagnostics/evv/gameface/de.champi.evv2.garage.json"
          cp "$root/core/res/mods/configs/res_map/MoEGarageGameFaceView.json"              "$GITHUB_WORKSPACE/moe/garage_diagnostics/evv/gameface/MoEGarageGameFaceView.json"

          curl -fL --retry 3 --connect-timeout 20             "https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version26.3.0/ffdec_26.3.0.zip"             -o "$root/ffdec.zip"
          unzip -q "$root/ffdec.zip" -d "$root/ffdec"
          chmod +x "$root/ffdec/ffdec.sh"

          "$root/ffdec/ffdec.sh" -export script "$root/garage_scripts" \
             "$root/core/res/gui/flash/evv_garage.swf"
          "$root/ffdec/ffdec.sh" -export script "$root/battle_scripts" \
             "$root/core/res/gui/flash/evv_battle.swf"

          find "$root/garage_scripts" -type f -name "*.as" -maxdepth 10 -print0 | while IFS= read -r -d '' f; do
            rel="$(basename "$f")"
            cp "$f" "$GITHUB_WORKSPACE/moe/garage_diagnostics/evv/garage_flash/$rel"
          done
          find "$root/battle_scripts" -type f -name "*.as" -maxdepth 10 -print0 | while IFS= read -r -d '' f; do
            rel="$(basename "$f")"
            cp "$f" "$GITHUB_WORKSPACE/moe/garage_diagnostics/evv/battle_flash/$rel"
          done

          {
            echo "=== EVV2 JS MODEL FIELDS ==="
            grep -nE "moe|mark|damage|garage|threshold|percent|vehicle|position|drag|65|85|95|100"               "$root/core/res/gui/gameface/mods/CHAMPi/EVV2/EVV2.js" | head -n 800 || true
            echo
            echo "=== EVV2 GARAGE FLASH MODEL FIELDS ==="
            grep -RniE "moe|mark|damage|garage|threshold|percent|vehicle|position|drag|65|85|95|100" \
              "$root/garage_scripts" | head -n 1200 || true
            echo
            echo "=== EVV2 BATTLE FLASH MODEL FIELDS ==="
            grep -RniE "visible|battle|moe|mark|damage|percent|position|drag|setData|setSettings" \
              "$root/battle_scripts" | head -n 1600 || true
            echo
            echo "=== EVV BACKEND STRINGS ==="
            strings -a -n 4 "$root/core/res/scripts/client/gui/mods/mod_evv.pyc" \
              | grep -Ei "battle|garage|show|enable|layout|config|setting|position|moe|marks|anchor" \
              | head -n 1600 || true
          } > "$GITHUB_WORKSPACE/moe/garage_diagnostics/evv/model_fields.txt"

      - name: Commit EVV decomposition
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moe/garage_diagnostics/evv
          if git diff --cached --quiet; then
            echo "No diagnostic changes."
            exit 0
          fi
          git commit -m "Record Expected Vehicle Values package decomposition"
          git pull --rebase origin work/moe-garage-decompose
          git push origin HEAD:work/moe-garage-decompose
