name: mirror-current-to-gitee-selfhosted

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-current-to-gitee-selfhosted.yml'
      - 'channel.json'
      - 'README.md'
      - 'CURRENT_RELEASE_INDEX.md'
      - 'manager/NAJXBox_Manager.exe'
      - 'payloads/2.4.0.1/unified/CNBOX_PAYLOAD_R5.zip'
      - 'manifests/2.4.0.1/CNBOX_FUNCTIONAL_R34_R2F9_R5.json'
      - 'language/CNBOX_LANGUAGE_PACK_2.4.0.1.zip'
      - 'moe/1.2.9/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild Gitee as current Public-only locked mirror
        shell: powershell
        env:
          GIT_TERMINAL_PROMPT: "0"
          GCM_INTERACTIVE: "Never"
        run: |
          $ErrorActionPreference = 'Stop'

          $src = $env:GITHUB_WORKSPACE
          $work = Join-Path $env:RUNNER_TEMP "najxbox-gitee-public-current"
          if (Test-Path $work) { Remove-Item $work -Recurse -Force }

          git clone "https://gitee.com/modanbo/cnbox-updates-cn.git" $work
          if ($LASTEXITCODE -ne 0) { throw "Gitee clone failed." }

          Set-Location $work
          git config user.name "modanbo"
          git config user.email "modanbo@users.noreply.gitee.com"

          $sourceChannel = Get-Content (Join-Path $src "channel.json") -Raw -Encoding UTF8 | ConvertFrom-Json

          if ([string]$sourceChannel.managerVersion -ne "2.1.1") {
            throw "GitHub Public Manager is not 2.1.1."
          }
          if (([string]$sourceChannel.managerSha256).ToLowerInvariant() -ne
              "35adb9af766646293eba0633b7bc7bc1901e0fa45383e35f39221ad7e7d2287b") {
            throw "Public Manager locked hash mismatch."
          }

          $r5 = @($sourceChannel.releases | Where-Object {
            $_.cnboxVersion -eq "2401-R34-R2F9-UNIFIED-R5" -and
            $_.status -eq "FINAL_LOCK" -and
            $_.releaseTrack -eq "PUBLIC_STANDALONE" -and
            $_.installMode -eq "CNBOX_AUTHORITATIVE" -and
            $_.aslainVersion -eq "ANY"
          })
          if ($r5.Count -ne 1) { throw "Public standalone Box R5 lock invalid." }

          $moe = @($sourceChannel.moePacks | Where-Object {
            $_.id -eq "CNBOX_MOE" -and
            $_.version -eq "1.2.9" -and
            $_.status -eq "FINAL_LOCK"
          })
          if ($moe.Count -ne 1) { throw "Public MoE 1.2.9 lock invalid." }

          # Destructive Gitee cleanup: keep .git only, rebuild exact Public surface.
          Get-ChildItem -Force |
            Where-Object { $_.Name -ne ".git" } |
            Remove-Item -Recurse -Force

          New-Item ".\manager" -ItemType Directory -Force | Out-Null
          Copy-Item (Join-Path $src "manager\NAJXBox_Manager.exe") ".\manager\CNBOX_Manager.exe" -Force

          function Copy-PublicFile([string]$rel,[string]$sha) {
            $srcFile = Join-Path $src $rel
            if (!(Test-Path $srcFile)) { throw "GitHub source missing: $rel" }
            $actual=(Get-FileHash $srcFile -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $sha.ToLowerInvariant()) {
              throw "GitHub source hash mismatch: $rel"
            }
            $dstFile=Join-Path (Get-Location) $rel
            New-Item (Split-Path $dstFile -Parent) -ItemType Directory -Force | Out-Null
            Copy-Item $srcFile $dstFile -Force
          }

          Copy-PublicFile "payloads\2.4.0.1\unified\CNBOX_PAYLOAD_R5.zip" "cf8ce97f9e33ee013c0383d2c940d5ee37985749bd8e12e299b13a8ad70829b6"
          Copy-PublicFile "manifests\2.4.0.1\CNBOX_FUNCTIONAL_R34_R2F9_R5.json" "0a10f9a97864b92260cd1eae520aec13097b9f010a71f53b47f177bb342e494a"
          Copy-PublicFile "language\CNBOX_LANGUAGE_PACK_2.4.0.1.zip" "e6fd0b357617bf4267a3b29458f9b810be9717d907d929c5c8c0fcb5b098a3a7"
          Copy-PublicFile "moe\1.2.9\NAJXBOX_MoE_INDEPENDENT_1.2.9_LOBBY_LIFECYCLE_OWNER_REBUILD_WOT_2.4.0.1.zip" "624276153a5b65bd74eda0009ffba23061cb0d111ccb78dd7f1328b1f100136c"

          # Retain only current MoE lock metadata, no history.
          Copy-Item (Join-Path $src "moe\1.2.9\manifest.json") ".\moe\1.2.9\manifest.json" -Force
          Copy-Item (Join-Path $src "moe\1.2.9\SHA256SUMS.txt") ".\moe\1.2.9\SHA256SUMS.txt" -Force

          # Minimal Public-only channel.
          $sourceChannel.releases = @($r5)
          $sourceChannel.moePacks = @($moe)
          foreach ($prop in @(
            "creatorManagerVersion",
            "creatorManagerUrl",
            "creatorManagerSha256",
            "creatorMoeTestPackage"
          )) {
            if ($sourceChannel.PSObject.Properties.Name -contains $prop) {
              $sourceChannel.PSObject.Properties.Remove($prop)
            }
          }

          $sourceChannel |
            ConvertTo-Json -Depth 100 |
            Set-Content ".\channel.json" -Encoding UTF8

          $managerHash=(Get-FileHash ".\manager\CNBOX_Manager.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($managerHash -ne "35adb9af766646293eba0633b7bc7bc1901e0fa45383e35f39221ad7e7d2287b") {
            throw "Gitee final Public Manager hash mismatch."
          }

          # Exact physical allowlist.
          $allowed = @(
            "README.md",
            "CURRENT_RELEASE_INDEX.md",
            "channel.json",
            "manager/CNBOX_Manager.exe",
            "payloads/2.4.0.1/unified/CNBOX_PAYLOAD_R5.zip",
            "manifests/2.4.0.1/CNBOX_FUNCTIONAL_R34_R2F9_R5.json",
            "language/CNBOX_LANGUAGE_PACK_2.4.0.1.zip",
            "moe/1.2.9/NAJXBOX_MoE_INDEPENDENT_1.2.9_LOBBY_LIFECYCLE_OWNER_REBUILD_WOT_2.4.0.1.zip",
            "moe/1.2.9/manifest.json",
            "moe/1.2.9/SHA256SUMS.txt"
          )

          $actualFiles = @(Get-ChildItem -File -Recurse |
            ForEach-Object {
              $_.FullName.Substring((Get-Location).Path.Length + 1).Replace("\","/")
            } |
            Sort-Object)

          $expectedFiles = @($allowed | Sort-Object)
          $diff = Compare-Object $expectedFiles $actualFiles
          if ($diff) {
            $diff | Format-Table | Out-String | Write-Host
            throw "Gitee physical allowlist mismatch."
          }

          git add -A
          if (git diff --cached --quiet) {
            Write-Host "Gitee already equals exact current Public locked mirror."
            exit 0
          }

          git commit -m "Prune Gitee to current Public locked release only"
          git push origin main

          Write-Host "GITEE_EXACT_PUBLIC_LOCKED_MIRROR_PASS"
          Write-Host "Manager=2.1.1"
          Write-Host "Box=2401-R34-R2F9-UNIFIED-R5"
          Write-Host "MoE=1.2.9 FINAL_LOCK"
          Write-Host "Physical files=$($actualFiles.Count)"
